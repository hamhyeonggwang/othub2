<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바람을 따라 · Wind Flight</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --ivory:#F5F0E8; --ink:#1A1A1A; --teal:#2A9D8F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0f1412;
    font-family:Pretendard,-apple-system,'Noto Sans KR',sans-serif;color:var(--ivory)}
  #scene{position:fixed;inset:0}

  /* ── 환경 상태 (숫자 없음) ─────────────────── */
  #ambient{position:fixed;top:20px;left:22px;z-index:10;pointer-events:none;
    font-size:13px;line-height:1.7;letter-spacing:.01em;
    text-shadow:0 1px 12px rgba(20,26,24,.55);opacity:0;transition:opacity 1.2s ease}
  #ambient .place{font-weight:600;opacity:.92}
  #ambient .wind{opacity:.62}

  /* ── 나지막한 안내 문장 ────────────────────── */
  #msg{position:fixed;left:50%;bottom:13%;transform:translateX(-50%);z-index:10;
    pointer-events:none;font-size:16px;letter-spacing:.02em;text-align:center;
    opacity:0;transition:opacity 1.8s ease;text-shadow:0 2px 16px rgba(20,26,24,.6);
    max-width:min(560px,82vw)}

  /* ── 소리 토글 ─────────────────────────────── */
  #mute{position:fixed;top:18px;right:20px;z-index:11;width:38px;height:38px;
    border-radius:50%;border:1px solid rgba(245,240,232,.28);background:rgba(26,32,30,.34);
    backdrop-filter:blur(6px);color:var(--ivory);cursor:pointer;font-size:15px;
    display:none;align-items:center;justify-content:center;transition:opacity .3s;opacity:.55}
  #mute:hover{opacity:1}

  /* ── 카메라 미리보기 ───────────────────────── */
  #camwrap{position:fixed;left:20px;bottom:20px;width:172px;border-radius:16px;overflow:hidden;
    border:1px solid rgba(245,240,232,.16);z-index:10;background:#000;display:none;opacity:.72;
    transition:opacity .4s}
  #camwrap:hover{opacity:1}
  #cam{width:100%;display:block;transform:scaleX(-1)}
  #skel{position:absolute;inset:0;width:100%;height:100%}

  /* ── 입구 화면 ─────────────────────────────── */
  #gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;text-align:center;
    background:radial-gradient(circle at 50% 42%,#243330,#0b100f 72%)}
  #gate h1{font-family:'Noto Serif KR',serif;font-size:36px;font-weight:700;letter-spacing:-.02em}
  #gate p{max-width:400px;line-height:1.9;font-size:14.5px;opacity:.72;padding:0 24px}
  .btn{pointer-events:auto;border:0;border-radius:18px;padding:14px 28px;font-size:15px;
    font-weight:600;font-family:inherit;cursor:pointer;background:var(--teal);color:#08110f;
    transition:transform .2s ease}
  .btn:hover{transform:translateY(-2px)}
  .btn.ghost{background:transparent;color:var(--ivory);border:1px solid rgba(245,240,232,.3)}
  #status{font-size:13px;opacity:.62;min-height:20px;line-height:1.6;max-width:420px;padding:0 20px}

  /* ── 연결 화면 (구 캘리브레이션) ───────────── */
  #tune{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;z-index:15;background:rgba(12,17,16,.66);
    backdrop-filter:blur(3px);text-align:center}
  #tune .lead{font-size:21px;font-weight:600;letter-spacing:.01em}
  #tune .sub{font-size:14px;opacity:.6}
  #dots{display:flex;gap:9px}
  #dots span{width:8px;height:8px;border-radius:50%;background:rgba(245,240,232,.22);
    transition:background .5s ease,transform .5s ease}
  #dots span.on{background:var(--teal);transform:scale(1.35)}

  /* ── 비행 시간 선택 ────────────────────────── */
  #dur{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .chip{pointer-events:auto;border:1px solid rgba(245,240,232,.22);background:transparent;
    color:var(--ivory);border-radius:999px;padding:8px 17px;font-size:13px;font-family:inherit;
    cursor:pointer;opacity:.55;transition:opacity .2s ease,border-color .2s ease}
  .chip:hover{opacity:.85}
  .chip.on{opacity:1;border-color:var(--teal);color:#BFE9E1}
  #durLabel{font-size:12px;opacity:.42;letter-spacing:.04em}

  /* ── 마무리 ────────────────────────────────── */
  #close{position:fixed;inset:0;z-index:18;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;text-align:center;
    pointer-events:none;opacity:0;transition:opacity 4s ease;
    background:rgba(10,14,24,.22)}
  #close .line{font-family:'Noto Serif KR',serif;font-size:25px;line-height:1.85;
    text-shadow:0 2px 20px rgba(8,12,20,.7)}
  #close .sub{font-size:13.5px;opacity:.58;line-height:1.8}
</style>
</head>
<body>

<div id="scene"></div>

<div id="ambient">
  <div class="place" id="aPlace"></div>
  <div class="wind" id="aWind"></div>
</div>

<div id="msg"></div>

<button id="mute" aria-label="소리 끄기">♪</button>

<div id="camwrap">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="skel"></canvas>
</div>

<div id="tune">
  <div class="lead">바람과 연결되는 중입니다</div>
  <div class="sub">잠시 후 새가 날아오릅니다</div>
  <div id="dots"><span></span><span></span><span></span></div>
</div>

<div id="gate">
  <h1>바람을 따라</h1>
  <p>팔을 펼치면 새가 바람을 탑니다.<br>
     숲과 하늘 사이를 지나갑니다.</p>
  <div id="durLabel">비행 시간</div>
  <div id="dur">
    <button class="chip" data-min="5">5분</button>
    <button class="chip on" data-min="10">10분</button>
    <button class="chip" data-min="20">20분</button>
    <button class="chip" data-min="0">시간 없이</button>
  </div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <button class="btn" id="btnCam">하늘로 들어가기</button>
    <button class="btn ghost" id="btnKey">키보드로 둘러보기</button>
  </div>
  <div id="status"></div>
</div>

<div id="close">
  <div class="line" id="closeLine">해가 다 졌습니다</div>
  <div class="sub">숲이 어둠에 잠겼습니다.<br>새는 계속 날고 있습니다.</div>
  <button class="btn ghost" id="btnAgain">다시 해가 뜨게 하기</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { FilesetResolver, PoseLandmarker }
  from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

/* ═══════════════════════════════════════════════════════════
   1. 시각 및 비행 설정값
   경험의 분위기를 조절하는 값들. 화면에서 자연스럽게 느껴지도록 조정한다.
   ═══════════════════════════════════════════════════════════ */
const CFG = {
  // 입력
  inputDeadzone : 0.16,   // 작은 움직임을 무시하는 폭 — 미세한 떨림까지 반응하면 감시당하는 느낌이 든다
  baselineFollow: 0.28,   // 기준선이 팔 높이를 따라가는 기본 속도.
                          //   자세를 유지할 의무를 없애는 핵심 값. 0으로 두면 예전의 절대 위치 방식.
  baselineHold  : 8,      // 편차가 클수록 기준선을 느리게 만드는 정도.
                          //   덕분에 의도한 큰 동작은 오래 살고, 피로로 인한 처짐만 흡수된다.
  inputSmooth   : 0.16,   // EMA 계수 (↓ 더 부드럽고 더 느긋함)
  inputMaxRate  : 2.4,    // 초당 입력 변화 상한 — 급격한 값 점프 차단
  pitchGain     : 1.15,   // 어깨 대비 손목 높이 → 상승 감도
  bankGain      : 1.25,   // 좌우 손목 높이차 → 선회 감도
  bankSign      : 1,      // 선회 방향 반전 스위치 (-1로 두면 좌우가 뒤집힘)
  flapGain      : 1.6,    // 날개짓 속도 → 바람 반응 (속도 경쟁 아님)

  // 비행
  cruiseSpeed   : 32,     // 입력이 없을 때의 기본 순항 속도
  minSpeed      : 26,
  maxSpeed      : 46,     // 최고 속도를 낮게 유지 — 서두를 이유를 없앰
  speedEase     : 0.9,    // 속도 변화 반응 (↓ 더 완만)
  turnRate      : 0.42,   // rad/s — 완만한 선회
  turnEase      : 1.5,    // 선회 각속도 자체의 보간
  climbRate     : 20,     // 팔을 올렸을 때의 상승 속도
  sinkRate      : 22,     // 팔을 내렸을 때의 하강 속도 (손이 화면 밖으로 나가기 쉬운 만큼만 보정)
  diveBoost     : 5,      // 내려갈 때 붙는 속도
  driftAmp      : 0.9,    // 입력이 없어도 아주 느리게 오르내린다 — 가만히 있어도 세계가 움직인다
  altitudeEase  : 0.6,    // 안전 고도 복귀의 부드러움 (낮을수록 덜 밀어올린다)
  vspeedEase    : 2.0,    // 수직 속도 보간
  safeHeight    : 60,     // 이 아래에서 완만한 복귀력이 생긴다
  floorHeight   : 26,     // 나무 우듬지 바로 위. 이 아래로는 확실히 밀어올린다.
  ceilingHeight : 430,    // 부드러운 상한
  roamRadius    : 1050,   // 이 밖으로 나가면 완만히 안쪽으로 유도

  // 새
  wingResponse  : 0.8,    // 팔 → 날개 각도 추종 속도
  wingSpan      : 0.85,   // 팔 높이가 날개 각도로 변환되는 폭

  // 카메라
  camBack       : 96, camUp : 30, camEase : 1.9,
  lookAhead     : 72, lookDrop : 8, lookEase : 2.6,

  // 세계
  discoveryCount: 14,     // 하늘에 동시에 떠 있는 빛의 개수
  discoveryRadius: 26,    // 이 거리 안에 들어오면 반응
  discoveryRespawn: 26,   // 초 — 다른 곳에 다시 나타남
  messageInterval : 18,   // 초 — 안내 문장 간격
  waterLevel    : -12
};

// 모두 풍경을 서술하는 문장이다. 사용자에게 무엇을 하라고 말하거나
// 잘하고 있다고 격려하지 않는다 — 격려는 누군가 지켜보고 있다는 뜻이 된다.
const MSG = [
  '바람이 날개 아래를 지나갑니다',
  '구름 사이로 빛이 들어옵니다',
  '숲이 아래에서 조용히 흐릅니다',
  '멀리 물빛이 반짝입니다',
  '하늘이 조금 넓어졌습니다',
  '나무 그림자가 길어집니다',
  '공기가 조금 서늘해집니다',
  '아래쪽에서 새 소리가 들립니다'
];
const MSG_DISCOVERY = [
  '빛이 잠시 머물다 갑니다',
  '작은 빛을 지나왔습니다',
  '무언가 반짝였습니다'
];

/* ═══════════════════════════════════════════════════════════
   2. Three.js 초기화
   ═══════════════════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById('scene').appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 1, 4000);

const HORIZON = 0xF2E6D6;                        // 지평선 쪽 따뜻한 색
scene.fog = new THREE.Fog(HORIZON, 520, 2100);   // 먼 풍경이 자연스럽게 흐려짐

const hemi = new THREE.HemisphereLight(0xffffff, 0x8d9575, 1.05);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dc, .62);
sun.position.set(220, 420, 140); scene.add(sun);

// 하늘 그라디언트 — 큰 구의 안쪽 면에 세로 그라디언트를 칠한다
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(2600, 24, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{
      cTop   :{value:new THREE.Color(0x9FC2DE)},   // 높은 하늘
      cMid   :{value:new THREE.Color(0xDCE3E0)},
      cBottom:{value:new THREE.Color(0xF6E7D2)}    // 지평선 근처
    },
    vertexShader:`varying vec3 vP;
      void main(){ vP = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader:`uniform vec3 cTop; uniform vec3 cMid; uniform vec3 cBottom; varying vec3 vP;
      void main(){
        float h = normalize(vP).y * 0.5 + 0.5;
        vec3 c = h < 0.5 ? mix(cBottom, cMid, h*2.0) : mix(cMid, cTop, (h-0.5)*2.0);
        gl_FragColor = vec4(c, 1.0); }`
  })
);
sky.renderOrder = -1;
scene.add(sky);

// 별 — 어스름에만 서서히 드러난다
const stars = (()=>{
  const N = 320, pos = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const u = Math.random()*Math.PI*2, v = Math.random()*0.85 + 0.1;   // 지평선 아래는 비움
    const r = 2300;
    pos[i*3]   = r*Math.cos(u)*Math.sqrt(1-v*v);
    pos[i*3+1] = r*v;
    pos[i*3+2] = r*Math.sin(u)*Math.sqrt(1-v*v);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const m = new THREE.PointsMaterial({color:0xEFEFFF, size:5.5, sizeAttenuation:false,
    transparent:true, opacity:0, depthWrite:false, fog:false});
  const pts = new THREE.Points(g, m);
  sky.add(pts);
  return pts;
})();

/* ═══════════════════════════════════════════════════════════
   3. 환경 생성 — 지형 · 나무 · 물 · 구름
   ═══════════════════════════════════════════════════════════ */
function terrainH(x,z){
  const m = 190 * Math.exp(-((x*x+z*z)/(2*230*230)));            // 중앙 봉우리
  return m
    + 34*Math.sin(x*0.0042)*Math.cos(z*0.0051)
    + 14*Math.sin(x*0.0138+1.7)*Math.cos(z*0.0121)
    + 5 *Math.sin(x*0.031)*Math.sin(z*0.028);
}
// 지면 또는 수면 중 높은 쪽 — 고도 보정의 기준
const groundLevel = (x,z) => Math.max(terrainH(x,z), CFG.waterLevel);

const SIZE = 2600, SEG = 190;
{
  const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position, colors = [];
  // 채도를 낮춘 차분한 3단계 — 저지대 연둣빛 → 중간 세이지 → 정상 회보라
  const cLow  = new THREE.Color(0xA9BC7C),
        cMid  = new THREE.Color(0xCBD3A6),
        cHigh = new THREE.Color(0xC7C2D2);
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = pos.getZ(i);
    const h = terrainH(x,z); pos.setY(i,h);
    const t = THREE.MathUtils.clamp(h/170,0,1);
    const c = t < .5 ? cLow.clone().lerp(cMid, t*2) : cMid.clone().lerp(cHigh, (t-.5)*2);
    colors.push(c.r,c.g,c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));
  geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({vertexColors:true, flatShading:true})));
}

// 물 — 낮은 지대가 자연스럽게 잠긴다. 반사 없이 반투명 평면만.
{
  const waterMat = new THREE.MeshLambertMaterial({
    color:0x8FB3BE, transparent:true, opacity:.6, depthWrite:false });
  const water = new THREE.Mesh(new THREE.PlaneGeometry(SIZE, SIZE), waterMat);
  water.rotation.x = -Math.PI/2;
  water.position.y = CFG.waterLevel;
  water.renderOrder = 1;
  scene.add(water);
}

// 나무 — 인스턴싱 유지. 크기·회전을 다양화하고 셰이더로 미세하게 흔든다.
let treeTimeUniform = null;
{
  const treeMat = new THREE.MeshLambertMaterial({color:0x86A16A, flatShading:true});
  treeMat.onBeforeCompile = (sh)=>{
    sh.uniforms.uTime = { value: 0 };
    treeTimeUniform = sh.uniforms.uTime;
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
       float ph = instanceMatrix[3][0]*0.021 + instanceMatrix[3][2]*0.017;
       float sway = sin(uTime*0.7 + ph) + 0.4*sin(uTime*1.3 + ph*1.7);
       float up = clamp((position.y + 9.0)/18.0, 0.0, 1.0);
       transformed.x += sway * 1.5 * up * up;`
    );
  };
  const tree = new THREE.InstancedMesh(new THREE.ConeGeometry(6,18,5), treeMat, 900);
  const d = new THREE.Object3D();
  for(let i=0;i<900;i++){
    const x=(Math.random()-.5)*SIZE*.92, z=(Math.random()-.5)*SIZE*.92;
    const h = terrainH(x,z);
    if(h < CFG.waterLevel + 4){ d.position.set(0,-9999,0); }      // 물에 잠긴 자리는 비움
    else d.position.set(x, h+8, z);
    d.rotation.y = Math.random()*Math.PI*2;
    d.scale.set(.55+Math.random()*.9, .6+Math.random()*1.2, .55+Math.random()*.9);
    d.updateMatrix(); tree.setMatrixAt(i,d.matrix);
  }
  scene.add(tree);
}

// 구름 — 구체 몇 개를 묶은 저비용 덩어리. 느리게 흐르고 충돌하지 않는다.
const clouds = [];
{
  const cloudMat = new THREE.MeshLambertMaterial({
    color:0xFBF6EE, transparent:true, opacity:.72, flatShading:true, depthWrite:false });
  const puff = new THREE.SphereGeometry(1, 7, 5);
  for(let i=0;i<13;i++){
    const g = new THREE.Group();
    const n = 4 + (Math.random()*3|0);
    for(let j=0;j<n;j++){
      const m = new THREE.Mesh(puff, cloudMat);
      m.position.set((Math.random()-.5)*70, (Math.random()-.5)*14, (Math.random()-.5)*44);
      m.scale.setScalar(16 + Math.random()*20);
      g.add(m);
    }
    g.position.set((Math.random()-.5)*2000, 300 + Math.random()*230, (Math.random()-.5)*2000);
    g.userData.drift = 1.6 + Math.random()*2.2;
    scene.add(g); clouds.push(g);
  }
}

/* ═══════════════════════════════════════════════════════════
/* ═══════════════════════════════════════════════════════════
   4. 새 모델
   좌표 메모: 새는 로컬 +z를 향한다. 새의 왼쪽 날개는 +x이고
   화면 왼쪽에 보이며, 사용자의 왼팔에 대응한다.
   날개는 뿌리(어깨)가 원점에 오도록 만들어 z축 기준으로 접었다 편다.
   ═══════════════════════════════════════════════════════════ */
const bird = new THREE.Group();

// 색: 초록 몸 + 연한 청백색 날개.
// 날개(가장 넓은 면)가 청백색이라 세이지빛 지형 위에서 충분히 떠오른다.
const MAT = {
  body : new THREE.MeshLambertMaterial({color:0x3E9B4F, flatShading:true}),
  wing : new THREE.MeshLambertMaterial({color:0x9BD6E8, side:THREE.DoubleSide, flatShading:true}),
  tail : new THREE.MeshLambertMaterial({color:0xA8DCEA, side:THREE.DoubleSide, flatShading:true}),
  beak : new THREE.MeshLambertMaterial({color:0xE07A3C, flatShading:true}),
  foot : new THREE.MeshLambertMaterial({color:0xD9743A, flatShading:true})
};

{
  // 몸통 — 구를 앞뒤로 늘여 유선형으로
  const body = new THREE.Mesh(new THREE.SphereGeometry(3.4, 9, 6), MAT.body);
  body.scale.set(.88, .8, 2.1);
  bird.add(body);

  // 머리 — 몸통보다 작고 살짝 위·앞
  const head = new THREE.Mesh(new THREE.SphereGeometry(2.3, 8, 6), MAT.body);
  head.position.set(0, 1.3, 6.2);
  head.scale.set(1, .95, 1.1);
  bird.add(head);

  // 부리
  const beak = new THREE.Mesh(new THREE.ConeGeometry(.85, 3.2, 4), MAT.beak);
  beak.rotation.x = Math.PI/2;
  beak.position.set(0, .9, 8.6);
  bird.add(beak);

  // 꼬리 — 갈라진 삼각형 두 장 (실루엣을 새답게 만드는 핵심)
  const tg = new THREE.BufferGeometry();
  tg.setAttribute('position', new THREE.Float32BufferAttribute([
     0, 0, -5.0,   -3.6, 0, -12.0,    0, 0, -9.0,
     0, 0, -5.0,    0,   0,  -9.0,   3.6, 0, -12.0
  ], 3));
  tg.computeVertexNormals();
  const tail = new THREE.Mesh(tg, MAT.tail);
  tail.position.y = -.2;
  tail.rotation.x = -.12;                 // 꼬리를 아주 살짝 들어 올림
  bird.add(tail);

  // 다리 — 나는 중에는 몸 아래에 접어 뒤로 눕힌다.
  // 아래에서 올려다볼 때 배가 매끈한 덩어리로 보이지 않게 하는 요소.
  const legGeo = new THREE.ConeGeometry(.42, 3.8, 5);   // 앞이 굵고 뒤로 갈수록 가늘다
  const toeGeo = new THREE.ConeGeometry(.30, 1.6, 4);
  for(const sx of [-1, 1]){
    // 배 아래를 따라 거의 수평으로 눕는다. 앞끝은 몸통에 묻히고 뒤쪽만 드러난다.
    const leg = new THREE.Mesh(legGeo, MAT.foot);
    leg.rotation.x = -Math.PI/2;
    leg.position.set(sx*1.45, -2.35, -1.6);
    bird.add(leg);

    // 발끝은 뒤아래로 살짝 처진다
    const toe = new THREE.Mesh(toeGeo, MAT.foot);
    toe.rotation.x = -Math.PI/2 - .35;
    toe.position.set(sx*1.45, -2.45, -3.9);
    bird.add(toe);
  }
}

/* 날개 — 두 마디로 나뉜다.
   안마디(팔): 뿌리에서 손목까지. 넓고 앞으로 나와 있으며 가운데가 살짝 부풀어 있다(캠버).
   바깥마디(손): 손목에 달린 갈라진 깃 4장. 사이의 틈으로 하늘이 보이는 것이 새의 단서다.
   두 마디를 따로 회전시켜 끝이 늦게 따라오게 하면 날개짓이 기계적으로 보이지 않는다. */
const quad = (v, A,B,C,D) => { v.push(...A,...B,...C,  ...A,...C,...D); };

// 안마디 — 뿌리(0) · 중간(5) · 손목(10) 세 지점, 앞·가운데·뒤 세 줄
function makeArmGeo(){
  const ST = [                                  // 손목 쪽으로 갈수록 좁아진다
    { x:0,  le:3.6, mid:[ 0.10, .50], te:-3.4 },
    { x:5,  le:3.2, mid:[ 0.10, .45], te:-3.0 },
    { x:10, le:2.4, mid:[ 0.10, .34], te:-2.2 }
  ];
  const P = ST.map(s => ({
    LE :[s.x, 0, s.le],
    MID:[s.x, s.mid[1], s.mid[0]],     // 가운데 줄을 살짝 들어 캠버를 만든다
    TE :[s.x, 0, s.te]
  }));
  const v = [];
  for(let i=0;i<2;i++){
    quad(v, P[i].LE,  P[i+1].LE,  P[i+1].MID, P[i].MID);
    quad(v, P[i].MID, P[i+1].MID, P[i+1].TE,  P[i].TE);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(v,3));
  g.computeVertexNormals();
  return g;
}

// 바깥마디 — 깃 4장. 바깥쪽이 길고 뒤로 더 젖혀진다.
function makeHandGeo(){
  // 끝으로 갈수록 넓어져 서로 맞닿고, 뒷가장자리에만 홈이 남는다
  //        길이  뿌리z  끝z   뿌리폭 끝폭
  const F = [
    [8.8,  2.4, -0.4, 1.30, 1.50],
    [8.6,  1.0, -2.0, 1.30, 1.50],
    [7.8, -0.4, -3.5, 1.20, 1.40],
    [6.4, -1.7, -4.6, 1.10, 1.30]
  ];
  const v = [];
  for(const [L, rz, tz, rw, tw] of F){
    quad(v, [0,0,rz], [L,0,tz], [L,0,tz-tw], [0,0,rz-rw]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(v,3));
  g.computeVertexNormals();
  return g;
}
const ARM_GEO = makeArmGeo(), HAND_GEO = makeHandGeo();

function makeWing(){
  const arm  = new THREE.Mesh(ARM_GEO,  MAT.wing);
  const hand = new THREE.Mesh(HAND_GEO, MAT.wing);
  hand.position.set(10, 0, 0);        // 손목 위치
  hand.rotation.z = -0.10;            // 쉴 때 끝이 살짝 처진다
  arm.add(hand);
  return { arm, hand };
}
const WL = makeWing(), WR = makeWing();
const wingLeft  = WL.arm,  wingLeftHand  = WL.hand;   // 사용자 왼팔 → 새의 왼쪽(+x)
const wingRight = WR.arm,  wingRightHand = WR.hand;   // 사용자 오른팔 → 새의 오른쪽(-x)
wingLeft.position.set(2.6, .5, 0);
wingRight.position.set(-2.6, .5, 0);
wingRight.scale.x = -1;                  // 좌우 대칭 (양면 재질이라 법선 반전 무해)
bird.add(wingLeft, wingRight);

bird.scale.setScalar(1.15);
// yaw(외곽) → pitch → roll 순서. XYZ 기본값이면 선회 중 피치가 월드축을 기준으로 돌아 어긋난다.
bird.rotation.order = 'YXZ';
scene.add(bird);

/* ═══════════════════════════════════════════════════════════
   5. 발견 요소 — 빛 무리. 모아야 할 대상이 아니라 지나치는 풍경이다.
   ═══════════════════════════════════════════════════════════ */
const motes = [];
const MOTE_MAT = new THREE.MeshBasicMaterial({color:0xFFE9A8, transparent:true, opacity:.9});
{
  const geo = new THREE.SphereGeometry(3.4, 10, 8);
  const mat = MOTE_MAT;
  const halo = new THREE.SphereGeometry(7.5, 10, 8);
  const haloMat = new THREE.MeshBasicMaterial({
    color:0xFFF0C0, transparent:true, opacity:.16, depthWrite:false});
  for(let i=0;i<CFG.discoveryCount;i++){
    const g = new THREE.Group();
    g.add(new THREE.Mesh(geo, mat), new THREE.Mesh(halo, haloMat));
    g.userData = { phase: Math.random()*6.28, cooldown: 0 };
    placeMote(g);
    scene.add(g); motes.push(g);
  }
}
function placeMote(g){
  const a = Math.random()*Math.PI*2, r = 180 + Math.random()*820;
  const x = Math.cos(a)*r, z = Math.sin(a)*r;
  g.position.set(x, groundLevel(x,z) + 90 + Math.random()*150, z);
  g.visible = true;
  g.userData.cooldown = 0;
}

// 파티클 풀 — 매 프레임 객체를 만들지 않는다
const PCOUNT = 220;
const particles = { pos:new Float32Array(PCOUNT*3), vel:new Float32Array(PCOUNT*3),
                    life:new Float32Array(PCOUNT), head:0 };
{
  for(let i=0;i<PCOUNT;i++) particles.pos[i*3+1] = -9999;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(particles.pos,3));
const pPoints = new THREE.Points(pGeo, new THREE.PointsMaterial({
  color:0xFFE7A6, size:2.6, transparent:true, opacity:.85,
  depthWrite:false, blending:THREE.AdditiveBlending }));
scene.add(pPoints);

function emitParticles(x,y,z,n){
  for(let k=0;k<n;k++){
    const i = particles.head; particles.head = (particles.head+1) % PCOUNT;
    particles.pos[i*3]=x; particles.pos[i*3+1]=y; particles.pos[i*3+2]=z;
    particles.vel[i*3]  =(Math.random()-.5)*22;
    particles.vel[i*3+1]=(Math.random()-.2)*16;
    particles.vel[i*3+2]=(Math.random()-.5)*22;
    particles.life[i] = 1.1 + Math.random()*.7;
  }
}
function stepParticles(dt){
  let alive = false;
  for(let i=0;i<PCOUNT;i++){
    if(particles.life[i] <= 0) continue;
    alive = true;
    particles.life[i] -= dt;
    if(particles.life[i] <= 0){ particles.pos[i*3+1] = -9999; continue; }
    particles.pos[i*3]   += particles.vel[i*3]  *dt;
    particles.pos[i*3+1] += particles.vel[i*3+1]*dt;
    particles.pos[i*3+2] += particles.vel[i*3+2]*dt;
    particles.vel[i*3+1] -= 6*dt;
  }
  if(alive) pGeo.attributes.position.needsUpdate = true;
}

/* ═══════════════════════════════════════════════════════════
   6. Pose 입력
   ═══════════════════════════════════════════════════════════ */
const input = { bank:0, pitch:0, flap:0, armL:0, armR:0 };
const ema   = { bank:0, pitch:0, flap:0, armL:0, armR:0 };
let mode = null, landmarker = null, lastVideoTime = -1;
let prevWristY = null, lastPoseAt = 0;
let calibPitch = 0, calibArmL = 0, calibArmR = 0;
// 팔 높이의 기준선. 고정된 값이 아니라 사용자를 천천히 따라간다.
// 팔이 서서히 처져도 기준선이 함께 내려가므로 가라앉지 않는다 — 자세를 유지할 필요가 없다.
let basePitch = null;
let rawPitch = null, rawArmL = null, rawArmR = null;

const video = document.getElementById('cam');
const skel  = document.getElementById('skel');
const sctx  = skel.getContext('2d');
const LINKS = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24]];

async function startCamera(){
  const st = document.getElementById('status');
  st.textContent = '하늘을 준비하는 중…';
  const vision = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  landmarker = await PoseLandmarker.createFromOptions(vision,{
    baseOptions:{ modelAssetPath:
      'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
      delegate:'GPU' },
    runningMode:'VIDEO', numPoses:1
  });
  st.textContent = '카메라를 사용해도 될까요?';
  video.srcObject = await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}});
  await video.play();
  skel.width = video.videoWidth; skel.height = video.videoHeight;
  document.getElementById('camwrap').style.display='block';
  mode='pose'; enterSky();
  connectWind();
}

// 구 캘리브레이션 — 압박 없는 문구와 점 3개로 표현
function connectWind(){
  const box = document.getElementById('tune');
  const dots = document.querySelectorAll('#dots span');
  box.style.display='flex';
  const sP=[], sL=[], sR=[];
  let c = 0;
  const tick = setInterval(()=>{ if(dots[c]) dots[c].classList.add('on'); c++; }, 1000);
  const grab = setInterval(()=>{
    if(rawPitch !== null){ sP.push(rawPitch); sL.push(rawArmL); sR.push(rawArmR); }
  }, 100);
  setTimeout(()=>{
    clearInterval(tick); clearInterval(grab);
    box.style.display='none';
    const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
    if(sP.length){ calibPitch = avg(sP); calibArmL = avg(sL); calibArmR = avg(sR); }
    showMessage('바람이 날개 아래를 지나갑니다');
  }, 3400);
}

function readPose(now){
  if(!landmarker || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const res = landmarker.detectForVideo(video, now);
  if(!res.landmarks?.length){ prevWristY = null; return; }   // 인식이 끊겨도 비행은 계속된다
  lastPoseAt = now;

  const L = res.landmarks[0];
  const LS=L[11], RS=L[12], LW=L[15], RW=L[16];
  const w = Math.max(Math.abs(LS.x-RS.x), 0.05);      // 어깨 너비 = 거리 정규화 기준
  const shoulderY = (LS.y+RS.y)/2, wristY = (LW.y+RW.y)/2;

  rawPitch = (shoulderY - wristY)/w;                  // 손목이 어깨보다 위 → +
  rawArmL  = (LS.y - LW.y)/w;                         // 왼팔 개별 높이
  rawArmR  = (RS.y - RW.y)/w;                         // 오른팔 개별 높이

  if(basePitch === null) basePitch = calibPitch;
  const pitch = (rawPitch - basePitch) * CFG.pitchGain;
  // 오른팔이 낮아지면 오른쪽으로 — bankSign으로 좌우 반전 가능
  const bank  = ((RW.y - LW.y)/w) * CFG.bankGain * CFG.bankSign;

  let flap = 0;
  if(prevWristY !== null)
    flap = Math.min(Math.abs(wristY - prevWristY)/w * 46 * CFG.flapGain, 1);
  prevWristY = wristY;

  setInput('pitch', dz(pitch));
  setInput('bank',  dz(bank));
  setInput('flap',  flap);
  setInput('armL',  THREE.MathUtils.clamp((rawArmL - calibArmL) * CFG.pitchGain, -1.4, 1.4));
  setInput('armR',  THREE.MathUtils.clamp((rawArmR - calibArmR) * CFG.pitchGain, -1.4, 1.4));

  drawSkeleton(L);
}
const dz = v => Math.abs(v) < CFG.inputDeadzone ? 0 : THREE.MathUtils.clamp(v,-1.4,1.4);

// 기준선이 실제 팔 높이를 천천히 좇는다.
// 빠른 움직임은 그대로 입력이 되고, 느린 처짐은 흡수되어 사라진다.
function updateBaseline(dt){
  if(rawPitch === null || basePitch === null) return;
  const dev = Math.abs(rawPitch - basePitch);
  // 편차가 작으면 빨리 따라잡고(= 처짐을 흡수), 크면 천천히 따라간다(= 의도한 동작을 살린다)
  const f = CFG.baselineFollow / (1 + CFG.baselineHold * dev);
  basePitch += (rawPitch - basePitch) * Math.min(dt * f, 1);
}

// EMA + 프레임 간 변화량 제한 — 갑작스러운 입력 점프를 막는다
let inputDt = 1/60;
function setInput(k, target){
  const next = ema[k]*(1-CFG.inputSmooth) + target*CFG.inputSmooth;
  const cap  = CFG.inputMaxRate * inputDt;
  ema[k] += THREE.MathUtils.clamp(next - ema[k], -cap, cap);
  input[k] = ema[k];
}
// 인식이 끊겼을 때 입력을 0으로 서서히 되돌린다
function decayInput(dt){
  for(const k of ['bank','pitch','flap','armL','armR']){
    ema[k] += (0 - ema[k]) * Math.min(dt*1.1, 1);
    input[k] = ema[k];
  }
}

function drawSkeleton(L){
  sctx.clearRect(0,0,skel.width,skel.height);
  sctx.save(); sctx.translate(skel.width,0); sctx.scale(-1,1);
  sctx.strokeStyle='rgba(160,225,235,.9)'; sctx.lineWidth=4;
  for(const [a,b] of LINKS){
    sctx.beginPath();
    sctx.moveTo(L[a].x*skel.width, L[a].y*skel.height);
    sctx.lineTo(L[b].x*skel.width, L[b].y*skel.height); sctx.stroke();
  }
  sctx.fillStyle='rgba(255,232,160,.95)';
  for(const i of [11,12,13,14,15,16,23,24]){
    sctx.beginPath(); sctx.arc(L[i].x*skel.width, L[i].y*skel.height, 5.5, 0, 7); sctx.fill();
  }
  sctx.restore();
}

/* ═══════════════════════════════════════════════════════════
   7. 키보드 입력 — 카메라 없이 둘러보기
   ═══════════════════════════════════════════════════════════ */
const keys = {};
addEventListener('keydown', e=>{ keys[e.code]=true; });
addEventListener('keyup',   e=>{ keys[e.code]=false; });
function readKeys(){
  const b = (keys.ArrowRight?1:0) - (keys.ArrowLeft?1:0);
  const p = (keys.ArrowUp?1:0)    - (keys.ArrowDown?1:0);
  setInput('bank',  b);
  setInput('pitch', p);
  setInput('flap',  keys.Space?1:0);
  setInput('armL',  p - b*0.35);
  setInput('armR',  p + b*0.35);
}

/* ═══════════════════════════════════════════════════════════
   8. 비행 상태 및 물리
   자동 활강 + 사용자의 부드러운 개입.
   기본 하강이 없고, 지면 충돌 대신 부드러운 고도 보정만 존재한다.
   ═══════════════════════════════════════════════════════════ */
const state = { x:0, y:150, z:-500, yaw:0, yawRate:0,
                speed:CFG.cruiseSpeed, vspeed:0, roll:0, t:0, flapPhase:0 };
let started = false, last = performance.now();
let handAngL = -0.10, handAngR = -0.10;   // 손마디의 절대 각도 (지연 추종용)

// 루프 밖에서 만들어 재사용
const vFwd = new THREE.Vector3(), vCamGoal = new THREE.Vector3(),
      vLookGoal = new THREE.Vector3(), vLook = new THREE.Vector3();

function step(dt){
  state.t += dt;

  /* 선회 — 목표 각속도를 두고 그쪽으로 서서히 붙인다 */
  const yawGoal = -input.bank * CFG.turnRate;     // + bank(오른팔 하강) → 우선회
  state.yawRate += (yawGoal - state.yawRate) * Math.min(dt*CFG.turnEase, 1);
  state.yaw += state.yawRate * dt;

  /* 속도 — 항상 순항 속도를 중심으로 좁은 범위 안에서만 움직인다 */
  let sGoal = CFG.cruiseSpeed + input.flap * (CFG.maxSpeed - CFG.cruiseSpeed)
              - Math.max(input.pitch,0) * 3
              + Math.max(-input.pitch,0) * CFG.diveBoost;   // 내려가면 미끄러지듯 빨라진다
  sGoal = THREE.MathUtils.clamp(sGoal, CFG.minSpeed, CFG.maxSpeed);
  state.speed += (sGoal - state.speed) * Math.min(dt*CFG.speedEase, 1);

  /* 고도 — 팔 높이로 개입하고, 안전 고도는 비행 자체가 지킨다 */
  const gy  = groundLevel(state.x, state.z);
  const agl = state.y - gy;
  // 올릴 때와 내릴 때의 계수를 다르게 준다
  let vGoal = input.pitch * (input.pitch >= 0 ? CFG.climbRate : CFG.sinkRate);
  if(agl < CFG.safeHeight)                                  // 완만한 복귀력
    vGoal += (CFG.safeHeight - agl) * CFG.altitudeEase;
  if(agl < CFG.floorHeight)                                 // 우듬지 아래로는 확실히 밀어올림
    vGoal = Math.max(vGoal, (CFG.floorHeight - agl) * 2.2);
  if(agl > CFG.ceilingHeight)                               // 너무 높으면 부드럽게 눌러줌
    vGoal -= (agl - CFG.ceilingHeight) * CFG.altitudeEase * .55;
  vGoal += Math.sin(state.t * 0.045) * CFG.driftAmp;        // 느린 기류 — 아무것도 안 해도 움직인다
  state.vspeed += (vGoal - state.vspeed) * Math.min(dt*CFG.vspeedEase, 1);
  state.y += state.vspeed * dt;

  /* 전진 */
  vFwd.set(Math.sin(state.yaw), 0, Math.cos(state.yaw));
  state.x += vFwd.x * state.speed * dt;
  state.z += vFwd.z * state.speed * dt;

  /* 경계 — 벽이 아니라 완만한 유도 */
  const r = Math.hypot(state.x, state.z);
  if(r > CFG.roamRadius){
    const inward = Math.atan2(-state.x, -state.z);
    let d = inward - state.yaw;
    while(d >  Math.PI) d -= Math.PI*2;
    while(d < -Math.PI) d += Math.PI*2;
    const pull = Math.min((r - CFG.roamRadius)/260, 1) * .5;
    state.yaw += d * pull * dt;
  }

  /* 새의 자세와 날개 */
  const rollGoal = input.bank * .42;
  state.roll += (rollGoal - state.roll) * Math.min(dt*2.0, 1);
  bird.position.set(state.x, state.y, state.z);
  bird.rotation.set(0, state.yaw, 0);
  bird.rotation.z = state.roll;
  bird.rotation.x = THREE.MathUtils.clamp(-state.vspeed*0.009, -.28, .28);

  // 날개짓: 항상 아주 작게 살아있고, 팔을 크게 움직이면 폭이 커진다
  state.flapPhase += dt * (2.1 + input.flap*3.4);
  // 날개는 뿌리에서 z축으로 접힌다. 양수 = 위로.
  // 오른쪽 날개는 scale.x=-1로 뒤집혀 있어 부호를 반대로 준다.
  const osc = Math.sin(state.flapPhase) * (.09 + input.flap*.42);
  const goalL =  osc + input.armL * CFG.wingSpan;
  const goalR =  osc + input.armR * CFG.wingSpan;
  const wr = Math.min(dt*6*CFG.wingResponse, 1);
  wingLeft.rotation.z  += ( goalL - wingLeft.rotation.z ) * wr;
  wingRight.rotation.z += (-goalR - wingRight.rotation.z) * wr;

  // 손끝은 어깨보다 늦게, 더 크게 따라온다 — 이 지연이 날개를 살아있게 만든다
  const hr = wr * 0.42;
  handAngL += (goalL*1.35 - 0.10 - handAngL) * hr;
  handAngR += (goalR*1.35 - 0.10 - handAngR) * hr;
  wingLeftHand.rotation.z  = THREE.MathUtils.clamp(handAngL - wingLeft.rotation.z,  -.9, .9);
  // 오른쪽은 부모에 scale.x=-1이 걸려 있어 자식 회전도 뒤집힌다.
  // 부모 각도(=-goalR)를 그대로 더해야 좌우가 같은 높이로 움직인다.
  wingRightHand.rotation.z = THREE.MathUtils.clamp(handAngR + wingRight.rotation.z, -.9, .9);

  /* 발견 요소 */
  for(const g of motes){
    if(!g.visible){
      g.userData.cooldown -= dt;
      if(g.userData.cooldown <= 0) placeMote(g);
      continue;
    }
    g.position.y += Math.sin(state.t*.9 + g.userData.phase) * 4 * dt;
    g.rotation.y += dt*.6;
    if(g.position.distanceTo(bird.position) < CFG.discoveryRadius){
      g.visible = false;
      g.userData.cooldown = CFG.discoveryRespawn;
      emitParticles(g.position.x, g.position.y, g.position.z, 26);
      playChime();
      if(Math.random() < .5) showMessage(pick(MSG_DISCOVERY));
    }
  }
  stepParticles(dt);
}

/* ═══════════════════════════════════════════════════════════
   9. 카메라 — 새보다 조금 높고 뒤. 급한 움직임 없음.
   ═══════════════════════════════════════════════════════════ */
function stepCamera(dt){
  vCamGoal.set(state.x, state.y, state.z)
    .addScaledVector(vFwd, -CFG.camBack);
  vCamGoal.y += CFG.camUp;
  // 지면 아래로 카메라가 파고들지 않게
  vCamGoal.y = Math.max(vCamGoal.y, groundLevel(vCamGoal.x, vCamGoal.z) + 12);
  camera.position.lerp(vCamGoal, Math.min(dt*CFG.camEase, 1));

  vLookGoal.set(state.x + vFwd.x*CFG.lookAhead,
                state.y - CFG.lookDrop,
                state.z + vFwd.z*CFG.lookAhead);
  vLook.lerp(vLookGoal, Math.min(dt*CFG.lookEase, 1));
  camera.lookAt(vLook);                 // roll 없음, FOV 고정
  sky.position.copy(camera.position);
}

/* ═══════════════════════════════════════════════════════════
   10. 환경 애니메이션 + 시간의 아크
   선택한 비행 시간에 걸쳐 낮 → 노을 → 어스름으로 넘어간다.
   목표도 실패도 없지만, 빛이 기울면서 경험에 형태가 생긴다.
   ═══════════════════════════════════════════════════════════ */
const ARC = [
  {p:0.00, top:0x9FC2DE, mid:0xDCE3E0, bot:0xF6E7D2, fog:0xF2E6D6,
   hSky:0xFFFFFF, hGnd:0x8D9575, hI:1.05, sun:0xFFF2DC, sI:.62, sunY:420, sunX: 220, star:0,   mote:.90, label:'낮'},
  {p:0.52, top:0x8FB4D8, mid:0xE4DCCC, bot:0xF7DFBC, fog:0xF0DCC2,
   hSky:0xFFF6E8, hGnd:0x8A8F6D, hI:.96, sun:0xFFE3B4, sI:.60, sunY:300, sunX: 300, star:0,   mote:.90, label:'늦은 오후'},
  {p:0.76, top:0x6E86B8, mid:0xD9A98F, bot:0xF0B183, fog:0xE3AE8C,
   hSky:0xF3CBB0, hGnd:0x7D7560, hI:.80, sun:0xFF9D5C, sI:.56, sunY:120, sunX: 380, star:0,   mote:.92, label:'노을'},
  {p:0.91, top:0x3E4E7A, mid:0x8A7898, bot:0xC98A78, fog:0x9C7C82,
   hSky:0xA08FA0, hGnd:0x50505E, hI:.55, sun:0xD4744F, sI:.30, sunY: 40, sunX: 430, star:.45, mote:1.0, label:'해질녘'},
  {p:1.00, top:0x1E2745, mid:0x40456B, bot:0x6A5F76, fog:0x4A4A63,
   hSky:0x47506E, hGnd:0x2E3340, hI:.36, sun:0x6A6A9A, sI:.14, sunY:-40, sunX: 460, star:.92, mote:1.0, label:'어스름'}
];
const PHASE_MSG = {
  '늦은 오후':'빛이 조금 낮아졌습니다',
  '노을'    :'하늘이 물들기 시작합니다',
  '해질녘'  :'숲이 조용히 어두워집니다',
  '어스름'  :'별이 하나둘 보입니다'
};

let arcDuration = 600;      // 초 — 시작 화면에서 선택. 0이면 시간이 흐르지 않는다
let arcT = 0, arcPhase = '낮', closed = false;

// 매 프레임 새 Color를 만들지 않도록 미리 확보
const _cA = new THREE.Color(), _cB = new THREE.Color(), _cOut = new THREE.Color();
const mix = (a,b,t) => a + (b-a)*t;
function mixHex(target, ha, hb, t){
  _cA.setHex(ha); _cB.setHex(hb);
  return target.copy(_cA).lerp(_cB, t);
}

function applyArc(p){
  let i = 0;
  while(i < ARC.length-2 && p > ARC[i+1].p) i++;
  const a = ARC[i], b = ARC[i+1];
  const t = THREE.MathUtils.clamp((p - a.p) / (b.p - a.p), 0, 1);

  const u = sky.material.uniforms;
  mixHex(u.cTop.value,    a.top, b.top, t);
  mixHex(u.cMid.value,    a.mid, b.mid, t);
  mixHex(u.cBottom.value, a.bot, b.bot, t);
  mixHex(scene.fog.color, a.fog, b.fog, t);

  mixHex(hemi.color,       a.hSky, b.hSky, t);
  mixHex(hemi.groundColor, a.hGnd, b.hGnd, t);
  hemi.intensity = mix(a.hI, b.hI, t);

  mixHex(sun.color, a.sun, b.sun, t);
  sun.intensity = mix(a.sI, b.sI, t);
  sun.position.set(mix(a.sunX,b.sunX,t), mix(a.sunY,b.sunY,t), 140);

  stars.material.opacity = mix(a.star, b.star, t);
  MOTE_MAT.opacity = mix(a.mote, b.mote, t);

  // 국면이 바뀌면 문장 한 줄
  const label = t < .5 ? a.label : b.label;
  if(label !== arcPhase){
    arcPhase = label;
    if(PHASE_MSG[label]) showMessage(PHASE_MSG[label]);
  }
}

function stepEnvironment(dt){
  if(treeTimeUniform) treeTimeUniform.value = state.t;
  for(const c of clouds){
    c.position.x += c.userData.drift * dt;
    if(c.position.x > 1300) c.position.x = -1300;
  }
  if(arcDuration <= 0) return;                 // "시간 없이" 모드
  arcT = Math.min(arcT + dt, arcDuration);
  applyArc(arcT / arcDuration);
  if(!closed && arcT >= arcDuration) finishArc();
}

// 마무리 — 비행을 멈추지 않는다. 조용히 카드만 떠오른다.
function finishArc(){
  closed = true;
  const el = document.getElementById('close');
  el.style.display = 'flex';
  requestAnimationFrame(()=>{ el.style.opacity = '1'; });
}
function restartArc(){
  const el = document.getElementById('close');
  el.style.opacity = '0';
  setTimeout(()=>{ el.style.display = 'none'; }, 4000);
  arcT = 0; closed = false; arcPhase = '낮'; basePitch = null;
  showMessage('다시 아침입니다');
}

/* ═══════════════════════════════════════════════════════════
   11. 사운드 — 바람 + 생성형 앰비언트 음악
   외부 음원 파일 없이 Web Audio로 화성을 직접 만든다.
   반복 구간이 없어 오래 들어도 같은 마디가 돌아오지 않는다.

   외부 음원을 쓰고 싶다면 아래 EXTERNAL_TRACK에 파일 경로를 넣는다.
   반드시 사용 허락이 있는 음원만 사용할 것 (CC0 · 로열티프리 · 직접 제작).
   CC-BY 음원은 화면 어딘가에 출처를 표기해야 한다.
   ═══════════════════════════════════════════════════════════ */
const EXTERNAL_TRACK = null;   // 예: './ambient.mp3'  — 지정하면 생성형 음악 대신 이 파일을 재생

let audio = null, masterGain = null;
let windGain = null, windFilter = null;
let musicBus = null, trackGain = null, reverbReturn = null;
let soundMode = 0;             // 0 전체 · 1 바람만 · 2 무음
let lastChimeAt = -99;

const LV = { wind: 0.10, music: 0.55, track: 0.5 };   // 각 계층의 기본 음량

// ── 화성 ───────────────────────────────────────────
// 세 벌 모두 D장조 / B단조 음 재료 안에 있어, 같은 5음 선율이 어디에나 얹힌다.
// 시간이 흐르면 밝은 장9화음에서 낮고 어두운 단조 쪽으로 옮겨간다.
const CHORDS_DAY = [               // 낮 — 밝고 열린 장9화음
  [38, 45, 54, 61, 64],   // Dmaj9
  [35, 42, 50, 57, 61],   // Bm7
  [31, 38, 47, 54, 57],   // Gmaj7
  [33, 40, 49, 54, 59]    // A6/9
];
const CHORDS_EVE = [               // 저녁 — 3음을 덜어낸 빈 5도 중심, 색이 옅어진다
  [38, 45, 52, 57, 64],   // D add9
  [35, 42, 49, 54, 61],   // Bm
  [31, 38, 45, 50, 57],   // G
  [33, 40, 47, 52, 59]    // Asus
];
const CHORDS_NIGHT = [             // 어스름 — 한 옥타브 낮고 단조 중심
  [35, 42, 50, 54, 57],   // Bm7
  [31, 38, 47, 50, 57],   // Gmaj9
  [33, 40, 45, 52, 57],   // Asus2
  [30, 37, 45, 49, 54]    // F#m
];
const SCALE = [74, 76, 78, 81, 83, 86, 88];           // 선율용 D 장5음계
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

// 아크 진행률과, 밤으로 기우는 정도(0~1)
const arcP = () => arcDuration > 0 ? arcT / arcDuration : 0;
const nightEase = () => THREE.MathUtils.smoothstep(arcP(), 0.5, 1.0);

let chordIdx = 0, nextChordAt = 0, nextNoteAt = 0;

function initAudio(){
  if(audio) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  audio = new AC();
  if(audio.state === 'suspended') audio.resume();   // 일부 브라우저 대비

  masterGain = audio.createGain();
  masterGain.gain.value = 0.55;
  masterGain.connect(audio.destination);

  /* ── 바람 ── 갈색 노이즈 + 저역통과 */
  const len = audio.sampleRate * 3;
  const buf = audio.createBuffer(1, len, audio.sampleRate);
  const ch = buf.getChannelData(0);
  let v = 0;
  for(let i=0;i<len;i++){
    v = (v + (Math.random()*2-1)*0.22) * 0.94;
    ch[i] = v;
  }
  const src = audio.createBufferSource();
  src.buffer = buf; src.loop = true;

  windFilter = audio.createBiquadFilter();
  windFilter.type = 'lowpass';
  windFilter.frequency.value = 420;
  windFilter.Q.value = 0.6;

  windGain = audio.createGain();
  windGain.gain.value = 0.0001;
  src.connect(windFilter); windFilter.connect(windGain); windGain.connect(masterGain);
  src.start();
  windGain.gain.linearRampToValueAtTime(LV.wind, audio.currentTime + 5);

  /* ── 음악 버스 + 잔향 ── 임펄스 응답도 코드로 생성한다 */
  musicBus = audio.createGain();
  musicBus.gain.value = 0.0001;
  musicBus.connect(masterGain);

  const rev = audio.createConvolver();
  rev.buffer = makeImpulse(3.6, 2.6);
  reverbReturn = audio.createGain();
  reverbReturn.gain.value = 0.85;
  musicBus.connect(rev); rev.connect(reverbReturn); reverbReturn.connect(masterGain);

  trackGain = audio.createGain();
  trackGain.gain.value = 0.0001;
  trackGain.connect(masterGain);

  const t = audio.currentTime;
  musicBus.gain.linearRampToValueAtTime(LV.music, t + 8);   // 아주 느리게 들어온다
  nextChordAt = t + 1.5;
  nextNoteAt  = t + 12;

  if(EXTERNAL_TRACK) loadExternalTrack();

  document.getElementById('mute').style.display = 'flex';
}

// 잔향용 임펄스 — 노이즈를 지수 감쇠시킨 것
function makeImpulse(sec, decay){
  const rate = audio.sampleRate, len = Math.floor(rate*sec);
  const buf = audio.createBuffer(2, len, rate);
  for(let c=0;c<2;c++){
    const d = buf.getChannelData(c);
    for(let i=0;i<len;i++)
      d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay);
  }
  return buf;
}

// ── 패드: 한 화음의 각 음을 두 겹으로 살짝 어긋나게 울린다 ──
// len  : 화음이 머무는 시간 (밤일수록 길어진다)
// dark : 0=낮 1=밤. 저역통과 차단주파수를 낮춰 음색을 어둡게 만든다.
function schedulePad(t, notes, len, dark){
  const cut  = mix(660, 300, dark);
  const rise = mix(5, 7.5, dark);                  // 밤에는 더 느리게 스며든다
  for(const m of notes){
    const f = mtof(m);
    for(let d=-1; d<=1; d+=2){
      const o  = audio.createOscillator();
      const lp = audio.createBiquadFilter();
      const g  = audio.createGain();
      o.type = 'triangle';
      o.frequency.value = f;
      o.detune.value = d * mix(5, 8, dark);         // 밤에 조금 더 흔들리게
      lp.type = 'lowpass';
      lp.frequency.value = cut + Math.random()*260*(1-dark*0.7);
      lp.Q.value = 0.4;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.022, t + rise);
      g.gain.setValueAtTime(0.022, t + len - 3);
      g.gain.linearRampToValueAtTime(0.0001, t + len + 3);   // 다음 화음과 겹치며 사라짐
      o.connect(lp); lp.connect(g); g.connect(musicBus);
      o.start(t); o.stop(t + len + 3.4);
    }
  }
}

// ── 선율: 5음계에서 하나씩, 아주 드물게 ──
function playTone(midi, t, vel, dec){
  const d = dec || 5;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'sine';
  o.frequency.value = mtof(midi);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vel, t + 0.3);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g);
  if(audio.createStereoPanner){
    const p = audio.createStereoPanner();
    p.pan.value = (Math.random()*2-1) * 0.55;
    g.connect(p); p.connect(musicBus);
  } else g.connect(musicBus);
  o.start(t); o.stop(t + d + 0.2);
}

function stepMusic(){
  if(EXTERNAL_TRACK || soundMode !== 0) return;
  const t = audio.currentTime;
  const p = arcP(), dark = nightEase();

  // 탭이 백그라운드로 갔다 돌아왔을 때 밀린 화음이 몰아치지 않게
  if(nextChordAt < t - 3) nextChordAt = t;
  if(nextNoteAt  < t - 3) nextNoteAt  = t + 4;

  if(t >= nextChordAt){
    // 낮 → 저녁 → 어스름. 화음 진행 자체가 바뀐다.
    const bank = p < 0.5 ? CHORDS_DAY : (p < 0.8 ? CHORDS_EVE : CHORDS_NIGHT);
    const len  = mix(15, 22, dark);              // 밤에는 한 화음이 더 오래 머문다
    schedulePad(nextChordAt, bank[chordIdx % bank.length], len, dark);
    chordIdx++;
    nextChordAt += len;
  }
  if(t >= nextNoteAt){
    const oct = dark > 0.6 ? -12 : 0;            // 어스름에는 선율도 한 옥타브 아래로
    playTone(SCALE[(Math.random()*SCALE.length)|0] + oct,
             t + 0.05, mix(0.075, 0.055, dark), mix(5, 8, dark));
    nextNoteAt = t + mix(5, 10, dark) + Math.random()*mix(8, 14, dark);
  }
  // 잔향이 깊어지고 바람이 잦아든다
  reverbReturn.gain.setTargetAtTime(mix(0.85, 1.25, dark), t, 2);
}

async function loadExternalTrack(){
  try{
    const res = await fetch(EXTERNAL_TRACK);
    const buf = await audio.decodeAudioData(await res.arrayBuffer());
    const s = audio.createBufferSource();
    s.buffer = buf; s.loop = true;
    s.connect(trackGain); s.start();
    trackGain.gain.linearRampToValueAtTime(LV.track, audio.currentTime + 6);
  }catch(e){
    // 음원을 불러오지 못하면 조용히 생성형 음악으로 돌아간다
    console.warn('외부 음원을 불러오지 못했습니다:', e.message);
  }
}

function stepAudio(){
  if(!audio || soundMode === 2) return;
  const t = audio.currentTime, dark = nightEase();
  // 날개짓이 커지면 바람이 열리고, 밤이 될수록 낮고 잦아든다
  const dive = Math.max(-input.pitch, 0);
  windFilter.frequency.setTargetAtTime(
    mix(380, 230, dark) + input.flap*520 + dive*220 + state.speed*3, t, .4);
  windGain.gain.setTargetAtTime(
    mix(LV.wind, LV.wind*0.6, dark) + input.flap*0.08 + dive*0.05, t, .6);
  stepMusic();
}

// 발견의 종소리 — 같은 음계에서 높은 음 하나
function playChime(){
  if(!audio || soundMode === 2) return;
  if(state.t - lastChimeAt < 1.2) return;
  lastChimeAt = state.t;
  const dark = nightEase();
  playTone(SCALE[3 + ((Math.random()*4)|0)] + (dark > 0.6 ? 0 : 12),
           audio.currentTime, mix(0.09, 0.07, dark), mix(5, 7, dark));
}

// 소리 토글: 전체 → 바람만 → 무음
const SOUND_LABEL = ['♪','~','·'];
const SOUND_ARIA  = ['소리 끄기 (바람만 남기기)','바람 소리 끄기','소리 켜기'];
document.getElementById('mute').onclick = (e)=>{
  if(!audio) return;
  soundMode = (soundMode + 1) % 3;
  const t = audio.currentTime;
  windGain.gain.setTargetAtTime(soundMode < 2 ? LV.wind : 0.0001, t, .4);
  musicBus.gain.setTargetAtTime(soundMode === 0 ? LV.music : 0.0001, t, .8);
  trackGain.gain.setTargetAtTime(soundMode === 0 && EXTERNAL_TRACK ? LV.track : 0.0001, t, .8);
  e.currentTarget.textContent = SOUND_LABEL[soundMode];
  e.currentTarget.setAttribute('aria-label', SOUND_ARIA[soundMode]);
};

/* ═══════════════════════════════════════════════════════════
   12. UI와 안내 문장
   ═══════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const pick = a => a[(Math.random()*a.length)|0];

let msgTimer = null, nextMsgAt = CFG.messageInterval, lastMsg = '';
function showMessage(text){
  if(text === lastMsg) return;
  lastMsg = text;
  const el = $('msg');
  el.textContent = text;
  el.style.opacity = '1';
  clearTimeout(msgTimer);
  msgTimer = setTimeout(()=>{ el.style.opacity = '0'; }, 6000);
}

let ambTimer = 0;
function stepUI(dt){
  // 안내 문장 — 너무 자주 나타나지 않게
  if(state.t > nextMsgAt){
    nextMsgAt = state.t + CFG.messageInterval + Math.random()*10;
    showMessage(pick(MSG));
  }
  // 환경 상태 — 숫자 없이 장소와 바람만
  ambTimer -= dt;
  if(ambTimer <= 0){
    ambTimer = 2.5;
    const gh = terrainH(state.x, state.z);
    const r  = Math.hypot(state.x, state.z);
    let place = '숲 위';
    if(gh < CFG.waterLevel + 6) place = '물 위';
    else if(r < 260) place = '봉우리 근처';
    else if(state.y - groundLevel(state.x,state.z) > 260) place = '구름 가까이';
    $('aPlace').textContent = arcDuration > 0 ? arcPhase + ' · ' + place : place;
    $('aWind').textContent =
      input.flap > .45 ? '바람이 날개를 스칩니다'
      : input.flap > .18 ? '바람이 살랑입니다'
      : '바람이 잔잔합니다';
  }
}

/* ═══════════════════════════════════════════════════════════
   13. 메인 루프
   ═══════════════════════════════════════════════════════════ */
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min((now-last)/1000, .05); last = now;
  if(!started){ renderer.render(scene, camera); return; }
  inputDt = dt;

  if(mode === 'pose'){
    readPose(now);
    updateBaseline(dt);
    if(now - lastPoseAt > 500) decayInput(dt);   // 인식이 끊겨도 비행은 이어진다
  } else {
    readKeys();
  }

  step(dt);
  stepCamera(dt);
  stepEnvironment(dt);
  stepAudio();
  stepUI(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

/* ═══════════════════════════════════════════════════════════
   14. 시작과 오류 처리
   ═══════════════════════════════════════════════════════════ */
function enterSky(){
  $('gate').style.display = 'none';
  $('ambient').style.opacity = '1';
  started = true;
  last = performance.now();
  lastPoseAt = last;
  arcT = 0; closed = false; arcPhase = '낮';
  if(arcDuration > 0) applyArc(0);
  vLook.set(state.x, state.y, state.z + 60);
  camera.position.set(state.x, state.y + CFG.camUp, state.z - CFG.camBack);
}

// 비행 시간 선택
document.querySelectorAll('#dur .chip').forEach(c => {
  c.onclick = () => {
    document.querySelectorAll('#dur .chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on');
    arcDuration = Number(c.dataset.min) * 60;
  };
});
$('btnAgain').onclick = restartArc;

$('btnCam').onclick = () => {
  initAudio();
  startCamera().catch(e => {
    const st = $('status');
    const m = String(e && e.message || e);
    if(/Permission|NotAllowed/i.test(m))
      st.innerHTML = '카메라를 사용할 수 없습니다.<br>키보드로 둘러보기를 선택하면 방향키로 날 수 있습니다.';
    else if(/fetch|network|Failed to load|wasm/i.test(m))
      st.innerHTML = '움직임 인식 파일을 불러오지 못했습니다.<br>연결을 확인한 뒤 다시 시도하거나, 키보드로 둘러보세요.';
    else
      st.innerHTML = '지금은 카메라로 들어갈 수 없습니다.<br>키보드로 둘러보기를 선택해 주세요.';
  });
};
$('btnKey').onclick = () => { initAudio(); mode='key'; enterSky(); showMessage('방향키가 바람이 됩니다'); };

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
