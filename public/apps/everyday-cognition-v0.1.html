<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일상 인지활동</title>
<!--
  일상 인지활동 (가칭 everyday) v0.1 — OTHub 참여형 인지활동 웹앱 PRD v0.2의 P0 범위.
  - 세션 흐름 5단계: 체크인 → 주제 고르기 → 내 이야기 → 활동 → 나누기·약속
  - 활동 패턴 5개(숫자 엮기·차례 찾기·나눠 담기·순서 세우기·기억 꺼내기) × 주제 2개(오늘·부엌)
  - '내 이야기' 답은 이 페이지 메모리에만 두며 서버·브라우저 저장소에 쓰지 않는다.
  - 문항·카드 문구는 모두 새로 작성했다. 외부 활동지의 문구·양식은 쓰지 않는다.
-->
<style>
:root{
  --bg:#F6F3EC; --paper:#FFFFFF; --ink:#22262A; --ink2:#4E565E; --line:#D9D3C7;
  --accent:#2F6F8F; --accent-ink:#FFFFFF; --accent-soft:#E3EFF5;
  --ok:#2E7D4F; --ok-soft:#E3F2E8; --warm:#B5651D; --warm-soft:#FBEBDC;
  --focus:#F2B84B;
}
*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--bg); color:var(--ink); }
body{
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:24px; line-height:1.5; min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{ font:inherit; color:inherit; }
button:focus-visible,input:focus-visible{ outline:4px solid var(--focus); outline-offset:2px; }

/* ---------- 상단 진행 표시 ---------- */
#top{
  position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:12px;
  padding:10px 16px; background:var(--bg); border-bottom:1px solid var(--line);
}
#steps{ display:flex; gap:6px; flex:1; flex-wrap:wrap; }
#steps span{
  font-size:16px; padding:4px 12px; border-radius:999px; color:var(--ink2); background:#ECE7DC;
}
#steps span.on{ background:var(--accent); color:var(--accent-ink); font-weight:700; }
#steps span.done{ background:var(--ok-soft); color:var(--ok); }
#steps span.done::before{ content:"✓ "; }

/* 치료사 패널 버튼: 대상자가 실수로 누르지 않도록 길게 눌러야 열린다 */
#proBtn{
  position:relative; min-width:64px; min-height:64px; border:1px solid var(--line);
  background:var(--paper); border-radius:14px; font-size:15px; color:var(--ink2); cursor:pointer;
  overflow:hidden; padding:0 10px;
}
#proBtn i{
  position:absolute; left:0; bottom:0; height:5px; width:0; background:var(--accent);
}
#proBtn.holding i{ width:100%; transition:width .9s linear; }

/* ---------- 본문 ---------- */
#app{ max-width:1100px; margin:0 auto; padding:24px 16px 60px; }
h1{ font-size:36px; margin:0 0 8px; line-height:1.3; }
h2{ font-size:30px; margin:0 0 8px; line-height:1.35; }
.sub{ color:var(--ink2); margin:0 0 24px; font-size:22px; }
.q{ font-size:34px; font-weight:700; margin:8px 0 24px; line-height:1.35; }

.grid{ display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
.grid.big{ grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }

.btn{
  min-height:64px; padding:12px 24px; border-radius:16px; border:2px solid var(--line);
  background:var(--paper); cursor:pointer; font-size:24px; text-align:center;
}
.btn.main{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700; }
.btn.soft{ background:var(--accent-soft); border-color:var(--accent-soft); color:var(--accent); }
.btn:disabled{ opacity:.45; cursor:default; }
.row{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:24px; }
.row.end{ justify-content:flex-end; }
.spacer{ flex:1; }

.card{
  background:var(--paper); border:2px solid var(--line); border-radius:20px; padding:20px;
  cursor:pointer; text-align:left; min-height:64px; width:100%;
}
.card .ic{ font-size:48px; display:block; line-height:1.1; margin-bottom:8px; }
.card b{ display:block; font-size:28px; }
.card small{ display:block; color:var(--ink2); font-size:19px; margin-top:4px; }
.card.sel,.chip.sel{ border-color:var(--accent); background:var(--accent-soft); }
.card.sel::after,.chip.sel::after{ content:" ✓"; color:var(--accent); font-weight:700; }
.card.off{ opacity:.45; cursor:default; }

.chip{
  min-height:64px; padding:10px 22px; border-radius:16px; border:2px solid var(--line);
  background:var(--paper); cursor:pointer; font-size:26px;
}
.chips{ display:flex; flex-wrap:wrap; gap:12px; }

.note{
  margin-top:20px; padding:14px 18px; border-radius:14px; font-size:22px;
  background:var(--warm-soft); color:#6B3A0E;
}
.note.ok{ background:var(--ok-soft); color:#1D5434; }
.note:empty{ display:none; }

input[type=text]{
  font:inherit; font-size:26px; min-height:64px; padding:8px 16px; border-radius:14px;
  border:2px solid var(--line); background:var(--paper); width:min(420px,100%);
}

/* ---------- 활동 공통 ---------- */
.actHead{ display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; margin-bottom:8px; }
.actHead .t{ flex:1; min-width:260px; }
.lv{ font-size:18px; color:var(--ink2); }
.lvBtns{ display:flex; gap:8px; flex-wrap:wrap; }
.lvBtns .btn{ font-size:20px; padding:8px 16px; }

/* 숫자패드 */
.calcQ{ font-size:32px; font-weight:700; margin:12px 0; }
.answer{
  font-size:44px; font-weight:700; min-height:76px; padding:6px 20px; border-radius:16px;
  background:var(--paper); border:2px solid var(--line); display:inline-flex; align-items:center;
  min-width:220px; letter-spacing:2px;
}
.pad{ display:grid; grid-template-columns:repeat(3,96px); gap:10px; margin-top:16px; }
.pad .btn{ font-size:32px; padding:0; min-height:80px; }

/* 차례 찾기 */
.field{
  position:relative; display:grid; gap:14px; margin-top:12px;
  grid-template-columns:repeat(var(--cols,4),1fr);
}
.tcard{
  min-height:96px; border-radius:18px; border:2px solid var(--line); background:var(--paper);
  font-size:24px; cursor:pointer; padding:10px; transform:translate(var(--dx,0),var(--dy,0));
}
.tcard b{ display:block; font-size:22px; color:var(--accent); }
.tcard.done{ background:var(--ok-soft); border-color:var(--ok); color:var(--ok); }
.tcard.done::before{ content:"✓ "; }
.tcard.cue{ border-color:var(--focus); box-shadow:0 0 0 6px rgba(242,184,75,.45); }
.tcard.nudge{ animation:nudge .35s ease; }
@keyframes nudge{ 0%,100%{ transform:translate(var(--dx,0),var(--dy,0)); } 50%{ transform:translate(calc(var(--dx,0px) + 6px),var(--dy,0)); } }

/* 나눠 담기 */
.tray{ display:flex; flex-wrap:wrap; gap:12px; min-height:80px; margin:12px 0 20px; }
.boxes{ display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
.box{
  border:3px dashed var(--line); border-radius:20px; padding:14px; min-height:160px;
  background:#FBFAF6; cursor:pointer; text-align:left; width:100%;
}
.box h3{ margin:0 0 8px; font-size:26px; }
.box .in{ display:flex; flex-wrap:wrap; gap:8px; }
.box .in span{ font-size:20px; padding:4px 12px; border-radius:10px; background:var(--ok-soft); color:var(--ok); }
.box .in span::before{ content:"✓ "; }
.box.cue{ border-color:var(--focus); border-style:solid; }
.box.ready{ border-color:var(--accent); }

/* 순서 세우기 */
.slots{ display:grid; gap:10px; margin:12px 0 20px; }
.slot{
  display:flex; align-items:center; gap:14px; min-height:72px; padding:8px 16px; border-radius:16px;
  border:2px dashed var(--line); background:#FBFAF6; cursor:pointer; text-align:left; width:100%;
}
.slot .n{
  flex:none; width:44px; height:44px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
  display:inline-flex; align-items:center; justify-content:center; font-weight:700;
}
.slot.filled{ border-style:solid; background:var(--paper); }
.slot.locked{ border-color:var(--ok); background:var(--ok-soft); cursor:default; }
.slot.locked .n{ background:var(--ok); color:#fff; }
.slot.ready{ border-color:var(--accent); }
.slotin{ display:flex; flex-wrap:wrap; gap:8px; }
.slotin .chip{ min-height:52px; font-size:22px; padding:6px 14px; }
.chip.cue{ border-color:var(--focus); box-shadow:0 0 0 6px rgba(242,184,75,.45); }
.chainline{ font-size:24px; color:var(--ink2); margin:8px 0; }
.chainline b{ color:var(--accent); }

/* 규칙 반응 */
.rwrap{ text-align:center; margin-top:12px; }
.rcard{
  margin:12px auto; width:min(560px,100%); min-height:180px; border-radius:24px; border:3px solid var(--line);
  background:var(--paper); display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:700; padding:16px;
}
.rcard.notice{ font-size:28px; color:var(--ink2); }
.rcard.gap{ background:#F0ECE3; }
.rcard.ok{ border-color:var(--ok); background:var(--ok-soft); color:var(--ok); }
.rcard.hold{ border-color:var(--warm); background:var(--warm-soft); }
.rgo{ min-width:min(420px,100%); min-height:96px; font-size:32px; }

/* 오늘 만든 것 / 이야기 카드 */
.made{
  background:var(--paper); border:2px solid var(--line); border-radius:20px; padding:20px; margin-bottom:16px;
}
.made h3{ margin:0 0 8px; font-size:26px; }
.made ol,.made ul{ margin:0; padding-left:1.3em; }
.talk{ background:var(--accent-soft); border-color:var(--accent-soft); }

/* 치료사 패널 */
#pro{
  position:fixed; inset:0; z-index:50; background:rgba(20,24,28,.45); display:flex;
  align-items:center; justify-content:center; padding:16px;
}
#pro.hidden{ display:none; }
#pro .panel{
  background:var(--paper); border-radius:20px; padding:24px; width:min(560px,100%);
  max-height:92vh; overflow:auto; font-size:20px;
}
#pro .panel h2{ font-size:26px; }
#pro .panel .btn{ font-size:20px; min-height:56px; }
#pro .grp{ margin:14px 0; }
#pro .grp > div{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
#pro .muted{ color:var(--ink2); font-size:17px; }

/* 요약 */
table.sum{ border-collapse:collapse; width:100%; font-size:20px; background:var(--paper); }
table.sum th,table.sum td{ border:1px solid var(--line); padding:8px 12px; text-align:left; vertical-align:top; }
table.sum th{ background:#F0ECE3; width:32%; }

@media (max-width:640px){
  body{ font-size:22px; }
  h1{ font-size:30px; } .q{ font-size:28px; }
  .pad{ grid-template-columns:repeat(3,1fr); }
  .field{ grid-template-columns:repeat(2,1fr) !important; }
  .tcard{ transform:none; }
}
@media (prefers-reduced-motion:reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>
<body>

<div id="top">
  <div id="steps" aria-label="진행 단계"></div>
  <button id="proBtn" type="button" aria-label="치료사 패널 (길게 누르기)">치료사<i></i></button>
</div>
<main id="app" aria-live="polite"></main>

<div id="pro" class="hidden" role="dialog" aria-modal="true" aria-label="치료사 패널">
  <div class="panel" id="proPanel"></div>
</div>

/* ==========================================================

let S;
function freshState(){

  };

S = freshState();
let acts = {};      // 현재 화면의 버튼 동작

/* ==========================================================
   유틸
   ========================================================== */
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = v => String(v).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = (a,n) => shuffle(a).slice(0,n);
const won = n => n.toLocaleString("ko-KR")+"원";
const hourLabel = h => h === 12 ? "낮 12시" : (h<12 ? "오전 " : "오후 ") + (h%12===0 ? 12 : h%12) + "시";
const dim = (y,m) => new Date(y,m,0).getDate();
/* 받침 유무로 조사를 고른다: josa("미역국","을를") → "미역국을" */
function josa(word, pair){
  const w = String(word), c = w.charCodeAt(w.length-1);
  if(c < 0xAC00 || c > 0xD7A3) return w + pair[0] + "(" + pair[1] + ")";
  return w + ((c - 0xAC00) % 28 ? pair[0] : pair[1]);
}

function render(html, step){

  window.scrollTo(0,0);
  const first = app.querySelector("[data-focus]");
  if(first) first.focus({ preventScroll:true });
}
app.addEventListener("click", e => {

});
app.addEventListener("keydown", e => {
  if((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-act]')){ e.preventDefault(); e.target.click(); }

function setNote(text, ok){

}
function choose(what, self=true){ S.choices.push({ what, self }); }

/* ==========================================================
   0. 시작 (치료사)

/* ==========================================================
   1. 체크인 — 한 화면에 질문 하나
   ========================================================== */
let CI = [], ciIdx = 0, ciTried = false;
function startCheckin(){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth()+1, d = now.getDate(), w = now.getDay();
  const days = dim(y,m);
  const dayOpts = new Set([d]);
  [-2,-1,1,2,3].forEach(k => { const v = d+k; if(v>=1 && v<=days && dayOpts.size<3) dayOpts.add(v); });
  const WD = ["일","월","화","수","목","금","토"];
  CI = [
    { q:"지금은 몇 월인가요?", opts:shuffle([m, m%12+1, (m+10)%12+1]).map(v => [v, v+"월"]), ans:m,
      hint:`지난달은 ${(m+10)%12+1}월이었어요.` },
    { q:"오늘은 며칠인가요?", opts:shuffle([...dayOpts]).map(v => [v, v+"일"]), ans:d,
      hint: d>1 ? `어제는 ${d-1}일이었어요.` : "이번 달이 막 시작되었어요." },
    { q:"오늘은 무슨 요일인가요?", opts:WD.map((v,i) => [i, v+"요일"]), ans:w,
      hint:`어제는 ${WD[(w+6)%7]}요일이었어요.` },
    { q:"오늘 날씨는 어떤가요?", key:"weather",
      opts:[["맑음","☀️ 맑음"],["흐림","☁️ 흐림"],["비","🌧️ 비"],["눈","❄️ 눈"],["바람","🌬️ 바람"]] },
    { q:"지금 기분은 어떠세요?", key:"mood",
      opts:[[5,"😄 아주 좋아요"],[4,"🙂 좋아요"],[3,"😐 그저 그래요"],[2,"🙁 조금 안 좋아요"],[1,"😣 힘들어요"]] }
  ];
  ciIdx = 0; showCheckin();
}
function showCheckin(){
  const c = CI[ciIdx]; ciTried = false;
  acts = {
    ans(v,b){
      if(c.key){ S[c.key] = isNaN(+v) ? v : +v; return nextCi(); }
      if(+v === c.ans){
        if(!ciTried) S.checkin.firstTry++;
        S.checkin.total++;
        b.classList.add("sel"); setNote("맞아요.", true);
        setTimeout(nextCi, 700);
      }else{
        ciTried = true;
        setNote("다시 한 번 골라 볼까요? 힌트를 눌러도 괜찮아요.");
      }
    },
    hint(){ S.checkin.hints++; ciTried = true; setNote(c.hint); },
    skip(){ if(!c.key) S.checkin.total++; nextCi(); }
  };
  render(`
    <p class="lv">체크인 ${ciIdx+1} / ${CI.length}</p>
    <div class="q">${c.q}</div>
    <div class="chips">${c.opts.map(([v,l],i) => `<button class="chip" data-act="ans" data-v="${esc(v)}" ${i===0?"data-focus":""}>${l}</button>`).join("")}</div>
    <div id="note" class="note"></div>
    <div class="row">
      ${c.hint ? `<button class="btn soft" data-act="hint">힌트</button>` : ""}
      <span class="spacer"></span>
      <button class="btn" data-act="skip">건너뛰기</button>
    </div>
  `, 0);
}
function nextCi(){
  ciIdx++;
  if(ciIdx < CI.length) showCheckin(); else screenTheme();
}

/* ==========================================================
   2. 주제 고르기
   ========================================================== */
function screenTheme(){

}

/* ==========================================================
   3. 내 이야기 — 답은 이 세션의 활동 문항이 된다
   ========================================================== */
let stIdx = 0;
function startStory(){ stIdx = 0; S.storyAsked = THEMES[S.theme].story.length; showStory(); }
function showStory(){
  const q = THEMES[S.theme].story[stIdx];

    ${q.noInput ? "" : `<p class="sub" style="margin-top:20px">보기에 없으면 짧게 적어 주세요 (20자까지).</p>

    <div class="row end">

      <button class="btn main" data-act="next">다음</button>

  const inp = $("#own");
  if(inp) inp.addEventListener("input", () => { if(inp.value) { chosen = ""; app.querySelectorAll(".chip").forEach(c => c.classList.remove("sel")); } });
}
function nextStory(){
  stIdx++;

}

/* 테마·이야기에 따른 활동 제목 */
function dishName(){ return story("dish") || "자주 하는 요리"; }

    plan: k ? `오늘 저녁 ${dishName()} 준비 계획` : "내일 하루 계획 짜기"
  }[p];
}

/* ==========================================================
   4. 활동 고르기
   ========================================================== */
let showAll = false;
function screenPick(){
  const done = S.activities.map(a => a.pattern);
  const left = PATTERN_ORDER.filter(p => !done.includes(p));
  if(!left.length) return screenShare();
  const list = showAll ? left : left.slice(0,3);
  acts = {
    go(v){ choose("활동"); showAll = false; startActivity(v, 2, "start"); },
    more(){ showAll = true; screenPick(); },
    share(){ screenShare(); }
  };
  render(`
    <div class="q">${S.activities.length ? "하나 더 해 볼까요?" : "어떤 활동을 해 볼까요?"}</div>
    <div class="grid big">
      ${list.map((p,i) => `
        <button class="card" data-act="go" data-v="${p}" ${i===0?"data-focus":""}>
          <span class="ic">${PATTERNS[p].icon}</span><b>${esc(actTitle(p))}</b><small>${PATTERNS[p].name} · ${PATTERNS[p].fn}</small>
        </button>`).join("")}
    </div>
    <div class="row">
      ${!showAll && left.length > 3 ? `<button class="btn soft" data-act="more">다른 활동 보기</button>` : ""}
      <span class="spacer"></span>

    </div>
  `, 3);
}

/* ==========================================================
   활동 엔진
   ========================================================== */
function startActivity(pattern, level, by){
  let rec = S.cur && S.cur.pattern === pattern ? S.cur : null;
  if(!rec){
    rec = { pattern, theme:S.theme, title:actTitle(pattern), levelPath:[], hints:0, errors:0,
            correct:0, total:0, t0:Date.now(), durationSec:0, made:null };
    S.cur = rec;
  }
  rec.level = level;
  rec.levelPath.push({ level, by });
  rec.correct = 0; rec.total = 0; rec.errors = 0;
  RUN[pattern](rec);
}
function actShell(rec, instr, body){
  return `
    <div class="actHead">
      <div class="t">
        <p class="lv">${PATTERNS[rec.pattern].icon} ${PATTERNS[rec.pattern].name} · ${LEVEL_NAMES[rec.level]} (${rec.level}/3)</p>
        <h2>${esc(rec.title)}</h2>
        <p class="sub" style="margin-bottom:8px">${instr}</p>
      </div>
      <div class="lvBtns">
        <button class="btn" data-act="easier" ${rec.level<=1?"disabled":""}>조금 쉽게</button>
        <button class="btn" data-act="harder" ${rec.level>=3?"disabled":""}>더 어렵게</button>
        <button class="btn soft" data-act="hint">힌트</button>
      </div>
    </div>
    ${body}
    <div id="note" class="note"></div>`;
}
function baseActs(rec, hint){
  return {
    easier(){ S.levelRequests.client++; startActivity(rec.pattern, rec.level-1, "client"); },
    harder(){ S.levelRequests.client++; startActivity(rec.pattern, rec.level+1, "client"); },
    hint(){ rec.hints++; hint(); }
  };
}
/* 치료사가 활동을 중간에 멈출 때 — 기록에는 남기고 '중간에 멈춤'으로 표시한다 */
function stopCurrent(){
  const r = S.cur; if(!r) return null;
  r.made = r.made || { title:r.title, lines:["중간에 멈췄어요"] };
  r.stopped = true; r.durationSec = Math.round((Date.now()-r.t0)/1000);
  S.activities.push(r); S.cur = null;
  return r;
}
function finishActivity(rec){
  rec.durationSec = Math.round((Date.now() - rec.t0)/1000);
  S.activities.push(rec); S.cur = null;
  acts = { more(){ screenPick(); }, share(){ screenShare(); } };
  const left = PATTERN_ORDER.filter(p => !S.activities.some(a => a.pattern === p)).length;
  render(`
    <div class="q">다 하셨어요. 오늘 만든 것이에요.</div>
    ${madeHTML(rec)}
    <div class="row end">
      ${left ? `<button class="btn" data-act="more">활동 하나 더</button>` : ""}
      <button class="btn main" data-act="share" data-focus>나누기로 가기</button>
    </div>
  `, 3);
}
function madeHTML(rec){
  const m = rec.made || { title:rec.title, lines:[] };
  const list = m.ordered ? "ol" : "ul";
  return `<div class="made"><h3>${PATTERNS[rec.pattern].icon} ${esc(m.title)}</h3>
    <${list}>${m.lines.map(l => `<li>${esc(l)}</li>`).join("")}</${list}></div>`;
}

const RUN = {};

/* ---------- 숫자 엮기 ---------- */
RUN.calc = rec => {
  const probs = rec.theme === "kitchen" ? calcKitchen(rec.level) : calcToday(rec.level);
  let i = 0, buf = "", tries = 0;
  const solved = [];
  const draw = () => {
    const p = probs[i];
    acts = Object.assign(baseActs(rec, () => setNote(p.hint)), {
      key(v){ if(buf.length < 7){ buf += v; $("#ans").textContent = buf + (p.unit||""); } },
      del(){ buf = buf.slice(0,-1); $("#ans").textContent = buf ? buf + (p.unit||"") : ""; },
      ok(){
        if(!buf) return;
        if(+buf === p.ans){
          if(tries === 0) rec.correct++;
          rec.total++; solved.push(`${p.short} → ${p.ans.toLocaleString("ko-KR")}${p.unit||""}`);
          setNote("맞아요.", true);
          setTimeout(next, 700);
        }else{
          tries++; rec.errors++;
          if(tries >= 2){
            rec.total++; solved.push(`${p.short} → ${p.ans.toLocaleString("ko-KR")}${p.unit||""}`);
            setNote(`답은 ${p.ans.toLocaleString("ko-KR")}${p.unit||""}이에요. 같이 확인했으니 다음으로 가요.`);
            setTimeout(next, 2200);
          }else{
            buf = ""; $("#ans").textContent = "";
            setNote("다시 해 볼까요? 힌트를 눌러도 괜찮아요.");
          }
        }
      }
    });
    render(actShell(rec, `문제 ${i+1} / ${probs.length}. 숫자를 눌러 답을 넣고 ‘확인’을 누르세요.`, `
      <div class="calcQ">${p.q}</div>
      <div class="answer" id="ans" aria-live="polite"></div>
      <div class="pad">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="btn" data-act="key" data-v="${n}">${n}</button>`).join("")}
        <button class="btn" data-act="del" aria-label="지우기">⌫</button>
        <button class="btn" data-act="key" data-v="0">0</button>
        <button class="btn main" data-act="ok">확인</button>
      </div>`), 3);
  };
  const next = () => {
    i++; buf = ""; tries = 0;
    if(i < probs.length) draw();
    else { rec.made = { title:rec.title, lines:solved }; finishActivity(rec); }
  };
  draw();
};
function calcToday(level){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth()+1, d = now.getDate();
  const shift = k => new Date(y, m-1, d+k);
  const sumDigits = s => String(s).split("").reduce((a,c) => a + +c, 0);
  const mmdd = String(m).padStart(2,"0") + String(d).padStart(2,"0");
  const sets = {
    1:[
      { q:`오늘은 ${m}월 ${d}일이에요. 내일은 며칠일까요?`, ans:shift(1).getDate(), unit:"일", short:"내일은 며칠", hint:`${d}에 1을 더해요. 달이 바뀌면 1일이에요.` },
      { q:`오늘은 ${m}월 ${d}일이에요. 어제는 며칠이었을까요?`, ans:shift(-1).getDate(), unit:"일", short:"어제는 며칠", hint:`${d}에서 1을 빼요. 1일이면 지난달 마지막 날이에요.` },
      { q:`월(${m})과 일(${d})을 더하면 얼마일까요?`, ans:m+d, short:`${m} + ${d}`, hint:`${m} + ${d}` }
    ],
    2:[
      { q:`오늘부터 일주일 뒤는 며칠일까요?`, ans:shift(7).getDate(), unit:"일", short:"일주일 뒤는 며칠", hint:`${d}에 7을 더해요. 이번 달은 ${dim(y,m)}일까지 있어요.` },
      { q:`오늘 날짜를 숫자 넷으로 쓰면 ${mmdd}이에요. 네 숫자를 모두 더하면?`, ans:sumDigits(mmdd), short:`${mmdd.split("").join(" + ")}`, hint:mmdd.split("").join(" + ") },
      { q:`이번 달은 ${dim(y,m)}일까지 있어요. 이번 달이 끝날 때까지 며칠 남았을까요? (오늘 빼고)`, ans:dim(y,m)-d, unit:"일", short:"이번 달 남은 날", hint:`${dim(y,m)} − ${d}` }
    ],
    3:[
      { q:`올해 ${y}년의 숫자 넷을 모두 더하고, 오늘 일(${d})을 더하면?`, ans:sumDigits(y)+d, short:`${String(y).split("").join(" + ")} + ${d}`, hint:`${String(y).split("").join(" + ")} = ${sumDigits(y)}, 여기에 ${d}를 더해요.` },
      { q:`월(${m})과 일(${d})을 곱하면 얼마일까요?`, ans:m*d, short:`${m} × ${d}`, hint:`${d}를 ${m}번 더한 것과 같아요.` },
      { q:`오늘부터 30일 뒤는 몇 월일까요?`, ans:shift(30).getMonth()+1, unit:"월", short:"30일 뒤는 몇 월", hint:`이번 달은 ${dim(y,m)}일까지 있어요. 남은 날을 세어 봐요.` }
    ]
  };
  return sets[level];
}
function calcKitchen(level){
  const ing = shuffle(dishData().ing);
  const p = n => PRICE[n] || 1000;
  const fmt = n => `${n} ${won(p(n))}`;
  const pairs = [[0,1],[2,3],[4,0]].map(([a,b]) => [ing[a%ing.length], ing[b%ing.length]]);
  if(level === 1) return pairs.map(([a,b]) => ({
    q:`${fmt(a)}, ${fmt(b)}을 사면 모두 얼마일까요?`, ans:p(a)+p(b), unit:"원",
    short:`${a} + ${b}`, hint:`${won(p(a))} + ${won(p(b))}` }));
  if(level === 2) return [[0,1,2],[2,3,4],[1,3,4]].map(t => t.map(k => ing[k%ing.length])).map(([a,b,c]) => ({
    q:`${fmt(a)}, ${fmt(b)}, ${fmt(c)}을 사면 모두 얼마일까요?`, ans:p(a)+p(b)+p(c), unit:"원",
    short:`${a} + ${b} + ${c}`, hint:`먼저 두 개를 더하고, 마지막 하나를 더해요.` }));
  return pairs.map(([a,b]) => {
    const pay = p(a)+p(b) > 10000 ? 20000 : 10000;
    return { q:`${won(pay)}을 내고 ${fmt(a)}, ${fmt(b)}을 샀어요. 거스름돈은 얼마일까요?`,
      ans:pay-p(a)-p(b), unit:"원", short:`${won(pay)} − (${a} + ${b})`,
      hint:`먼저 두 값을 더해 ${won(p(a)+p(b))}. ${won(pay)}에서 빼요.` };
  });
}

  if(rec.theme === "kitchen"){
    const prefer = dishData().ing.filter(x => PRICE[x]);
    const rest = shuffle(Object.keys(PRICE).filter(x => !prefer.includes(x)));
    const seen = new Set(); items = [];
    for(const name of [...prefer, ...rest]){
      if(items.length >= n) break;
      if(seen.has(PRICE[name])) continue;
      seen.add(PRICE[name]); items.push({ key:PRICE[name], top:won(PRICE[name]), label:name });
    }

    const r = ROUTINE.map(([h,l]) => [h,l]);

    const keep = { 5:[0,2,5,8,9], 7:[0,1,2,4,5,8,9], 9:[0,1,2,3,4,5,6,8,9] }[n];
    items = keep.map(k => ({ key:r[k][0], top:hourLabel(r[k][0]), label:r[k][1] }));
  }
  const order = items.slice().sort((a,b) => a.key - b.key);
  const cards = shuffle(items);
  let at = 0, erredHere = false;
  const cols = n <= 5 ? 3 : n <= 7 ? 4 : 5;
  const instr = rec.theme === "kitchen"

  acts = Object.assign(baseActs(rec, () => {
    const el = app.querySelector(`.tcard[data-v="${order[at].key}"]`); if(el) el.classList.add("cue");

  }), {
    tap(v,b){
      if(b.classList.contains("done")) return;

        b.classList.remove("cue"); b.classList.add("done");
        if(!erredHere) rec.correct++;
        rec.total++; at++; erredHere = false; setNote("");
        if(at >= order.length){
          rec.made = { title:rec.title, ordered:true, lines:order.map(o => `${o.top} · ${o.label}`) };
          setTimeout(() => finishActivity(rec), 600);
        }
      }else{
        rec.errors++; erredHere = true;
        b.classList.remove("nudge"); void b.offsetWidth; b.classList.add("nudge");
        setNote(at === 0 ? "가장 처음 오는 것을 찾아볼까요?" : `방금 누른 것은 ‘${order[at-1].label}’이에요. 그다음을 찾아볼까요?`);
      }

  render(actShell(rec, instr, `
    <div class="field" style="--cols:${cols}">

RUN.seq = rec => {
  const n = [0,3,4,5][rec.level];
  let steps;
  if(rec.theme === "kitchen"){
    const all = dishData().steps;
    steps = { 3:[all[0],all[2],all[4]], 4:[all[0],all[1],all[2],all[4]], 5:all }[n];
  }else{
    const place = story("place");
    const end = PLACE_END[place] || `${placeName()}에서 볼일 보기`;
    const all = ["외출할 옷으로 갈아입기","신발 신기","현관문 잠그기",`${placeName()}까지 이동하기`,end];
    steps = { 3:[all[0],all[1],all[2]], 4:[all[0],all[1],all[2],end], 5:all }[n];
  }
  const slots = steps.map(() => null);      // 카드 index
  const locked = steps.map(() => false);
  let tray = shuffle(steps.map((_,i) => i));
  let firstCheck = true;
  const draw = () => {
    const full = slots.every(s => s != null);
    acts = Object.assign(baseActs(rec, () => {
      // 다음 빈 자리에 맞는 카드를 직접 놓아 준다
      const k = slots.findIndex((s,i) => !locked[i] && s !== i);
      if(k < 0) return;
      const cur = slots.indexOf(k);
      if(cur >= 0) slots[cur] = null;
      if(slots[k] != null) tray.push(slots[k]);
      tray = tray.filter(t => t !== k);
      slots[k] = k; locked[k] = true; draw();
      setNote(`${k+1}번째는 ‘${steps[k]}’예요.`);
    }), {
      card(v){
        const k = slots.findIndex(s => s == null);
        if(k < 0) return;
        slots[k] = +v; tray = tray.filter(t => t !== +v); draw();
      },
      slot(v){
        const k = +v;
        if(locked[k] || slots[k] == null) return;
        tray.push(slots[k]); slots[k] = null; draw();
      },
      check(){
        let wrong = 0;
        slots.forEach((s,i) => {
          if(locked[i]) return;
          if(s === i){ locked[i] = true; }
          else{ wrong++; tray.push(s); slots[i] = null; }
        });
        if(firstCheck){ rec.correct = locked.filter(Boolean).length; rec.total = steps.length; firstCheck = false; }
        if(wrong){ rec.errors += wrong; draw(); setNote(`맞게 놓인 칸은 초록색으로 고정했어요. 남은 ${wrong}장을 다시 놓아 볼까요?`); }
        else{
          rec.made = { title:rec.title, ordered:true, lines:steps };
          draw(); setTimeout(() => finishActivity(rec), 600);
        }
      }
    });
    render(actShell(rec, "아래 카드를 누르면 빈칸에 차례로 들어갑니다. 놓은 칸을 누르면 다시 빠집니다.", `
      <div class="slots">
        ${slots.map((s,i) => `<button class="slot ${s!=null?"filled":""} ${locked[i]?"locked":""}" data-act="slot" data-v="${i}">
          <span class="n">${i+1}</span><span>${s!=null ? esc(steps[s]) : "&nbsp;"}</span></button>`).join("")}
      </div>
      <div class="tray">${tray.map(t => `<button class="chip" data-act="card" data-v="${t}">${esc(steps[t])}</button>`).join("")}</div>
      <div class="row end"><button class="btn main" data-act="check" ${full?"":"disabled"}>다 놓았어요</button></div>`), 3);
  };
  draw();
};

  if(!kitchen && story("morning") && !A.includes(story("morning"))) A.push(story("morning"));
  const ruleA = kitchen ? `${dishName()}에 들어가는 재료가 나오면 누르세요.` : "아침에 하는 일이 나오면 누르세요.";
  const ruleB = kitchen ? "이번에는 반대로, 안 들어가는 것이 나오면 누르세요." : "이번에는 반대로, 저녁에 하는 일이 나오면 누르세요.";
  const n = [0,10,14,16][rec.level], ms = [0,4000,3000,3000][rec.level];
  const switchAt = rec.level === 3 ? 8 : -1;
  // 같은 종류가 세 번 넘게 이어지지 않게 섞는다
  let items = [];
  for(let k=0;k<n;k++) items.push(k % 2 ? { label:B[k % B.length], a:false } : { label:A[k % A.length], a:true });
  for(let t=0;t<30;t++){
    items = shuffle(items);
    if(!items.some((_,k) => k >= 3 && items.slice(k-3,k+1).every(x => x.a === items[k].a))) break;
  }
  let i = 0, tapped = false, timer = null, switched = false, live = false;
  let hits = 0, cr = 0, miss = 0, fa = 0;
  const isGo = it => (switched ? !it.a : it.a);
  const stop = () => { clearTimeout(timer); timer = null; live = false; };
  const card = () => $("#rcard");
  const showTrial = () => {
    if(i === switchAt && !switched){
      switched = true; stop();
      card().className = "rcard notice"; card().textContent = "규칙이 바뀌어요!";
      setNote(ruleB);
      $("#rgo").hidden = true; $("#rstart").hidden = false; $("#rstart").textContent = "알겠어요, 계속";
      $("#rule").textContent = ruleB;
      return;
    }
    if(i >= n) return done();
    tapped = false; live = true;
    card().className = "rcard"; card().textContent = items[i].label;
    $("#rprog").textContent = `${i+1} / ${n}`;
    timer = setTimeout(endTrial, ms);
  };
  const endTrial = () => {
    live = false;
    const it = items[i];
    if(!tapped){ if(isGo(it)){ miss++; rec.errors++; } else cr++; }
    card().className = "rcard gap"; card().textContent = "";
    i++;
    timer = setTimeout(showTrial, 700);
  };
  const done = () => {
    stop();
    rec.total = n; rec.correct = hits + cr;
    rec.made = { title:rec.title, lines:[
      `규칙: ${ruleA}${switchAt > 0 ? " → " + ruleB : ""}`,
      `맞게 누른 것 ${hits}개 · 잘 참은 것 ${cr}개`,
      `놓친 것 ${miss}개 · 참지 못한 것 ${fa}개`
    ] };
    finishActivity(rec);
  };
  acts = Object.assign(baseActs(rec, () => {
    const ex = switched ? (kitchen ? B : EVENING_DO) : A;
    setNote(`${switched ? ruleB : ruleA} 예: ${ex.slice(0,3).join(", ")}`);
  }), {
    start(){ $("#rstart").hidden = true; $("#rgo").hidden = false; $("#rpause").hidden = false; setNote(""); showTrial(); },
    go(){
      if(!live || tapped) return;
      tapped = true;
      if(isGo(items[i])){ hits++; card().className = "rcard ok"; card().textContent = "✓ " + items[i].label; }
      else{ fa++; rec.errors++; card().className = "rcard hold"; setNote("이건 참는 카드예요. 괜찮아요, 다음 카드를 봐요."); }
    },
    pause(){
      if(timer){ stop(); $("#rpause").textContent = "다시 시작"; card().className = "rcard notice"; card().textContent = "잠깐 쉬어요"; }
      else{ $("#rpause").textContent = "잠깐 멈춤"; showTrial(); }
    }
  });
  render(actShell(rec, `카드가 ${ms/1000}초마다 바뀝니다. 규칙에 맞을 때만 큰 버튼을 누르고, 아니면 그냥 기다리세요.`, `
    <div class="note ok" id="rule" style="font-size:26px;font-weight:700">${esc(ruleA)}</div>
    <div class="rwrap">
      <p class="lv" id="rprog">0 / ${n}</p>
      <div class="rcard notice" id="rcard">준비되면 시작을 누르세요</div>
      <div class="row" style="justify-content:center">
        <button class="btn main" id="rstart" data-act="start" data-focus>시작</button>
        <button class="btn main rgo" id="rgo" data-act="go" hidden>눌러요!</button>
        <button class="btn" id="rpause" data-act="pause" hidden>잠깐 멈춤</button>
      </div>
    </div>`), 3);
  setCleanup(stop);
};

/* ---------- 단어 잇기 ---------- */
function themeWords(rec){
  return rec.theme === "kitchen"
    ? [dishName(), ...dishData().ing, "부엌", "시장"]
    : [placeName(), story("meal") || "국수", "아침", "날씨", "오늘", "산책"];
}
function chainFrom(start, steps){
  // 깊이 우선으로 끝말이 이어지는 낱말 줄을 찾는다
  const go = (word, used) => {
    if(used.length === steps + 1) return used;
    const last = word[word.length-1];
    for(const w of shuffle(WORDS.filter(x => x[0] === last && !used.includes(x)))){
      const r = go(w, [...used, w]); if(r) return r;
    }
    return null;
  };
  return go(start, [start]);
}
RUN.word = rec => {
  const pool = themeWords(rec).filter(w => isHangul(w));
  if(rec.level === 1) return wordCho(rec, pool);
  if(rec.level === 2) return wordChain(rec, pool);
  return wordFree(rec, pool);
};
function wordCho(rec, pool){
  const rounds = [];
  for(const src of pool){
    const c = choOf(src[0]);
    if(rounds.some(r => r.c === c)) continue;
    const right = shuffle(WORDS.filter(w => choOf(w[0]) === c && w !== src))[0];
    if(!right) continue;
    const wrong = pick(WORDS.filter(w => choOf(w[0]) !== c), 3);
    rounds.push({ src, c, right, opts:shuffle([right, ...wrong]) });
    if(rounds.length === 5) break;
  }
  if(!rounds.length) return wordChain(rec, pool);
  let i = 0, tries = 0;
  const found = [];
  const draw = () => {
    const r = rounds[i];
    acts = Object.assign(baseActs(rec, () => setNote(`‘${r.src}’을(를) 천천히 소리 내 읽어 보세요. 첫소리는 ‘${r.c}’예요.`)), {
      opt(v,b){
        if(v === r.right){
          if(tries === 0) rec.correct++;
          rec.total++; found.push(`${r.c} — ${r.right}`); b.classList.add("sel");
          setNote("맞아요.", true);
          setTimeout(() => { i++; tries = 0; if(i < rounds.length) draw(); else { rec.made = { title:rec.title, lines:found }; finishActivity(rec); } }, 700);
        }else{ tries++; rec.errors++; setNote(`‘${v}’은(는) ‘${choOf(v[0])}’(으)로 시작해요. 다시 골라 볼까요?`); }
      }
    });
    render(actShell(rec, `문제 ${i+1} / ${rounds.length}`, `
      <div class="q" style="font-size:30px">‘${esc(r.src)}’의 첫소리 <b style="color:var(--accent)">${r.c}</b>(으)로 시작하는 낱말은?</div>
      <div class="chips">${r.opts.map(o => `<button class="chip" data-act="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`), 3);
  };
  draw();
}
function wordChain(rec, pool){
  const steps = 4;
  let chain = null;
  for(const s of [...pool, ...shuffle(WORDS)]){ chain = chainFrom(s, steps); if(chain) break; }
  if(!chain) return wordFree(rec, pool);
  let i = 1, tries = 0;
  const draw = () => {
    const prev = chain[i-1], right = chain[i], last = prev[prev.length-1];
    const wrong = pick(WORDS.filter(w => w[0] !== last && !chain.includes(w)), 2);
    const opts = shuffle([right, ...wrong]);
    acts = Object.assign(baseActs(rec, () => {
      const el = [...app.querySelectorAll(".chip")].find(c => c.dataset.v === right);
      if(el) el.classList.add("cue");
      setNote(`‘${last}’ 자로 시작하는 낱말을 찾아요.`);
    }), {
      opt(v,b){
        if(v === right){
          if(tries === 0) rec.correct++;
          rec.total++; setNote("맞아요.", true);
          setTimeout(() => { i++; tries = 0; if(i < chain.length) draw(); else { rec.made = { title:rec.title, lines:[chain.join(" → ")] }; finishActivity(rec); } }, 700);
        }else{ tries++; rec.errors++; setNote(`‘${v}’은(는) ‘${v[0]}’ 자로 시작해요. ‘${last}’ 자로 시작하는 걸 찾아볼까요?`); }
      }
    });
    render(actShell(rec, `끝말잇기 ${i} / ${steps}. 앞 낱말의 마지막 글자로 시작하는 낱말을 고르세요.`, `
      <div class="chainline">${chain.slice(0,i).map(esc).join(" → ")} → <b>?</b></div>
      <div class="q" style="font-size:30px">‘${esc(prev)}’ 다음에 올 낱말은?</div>
      <div class="chips">${opts.map(o => `<button class="chip" data-act="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`), 3);
  };
  draw();
}
function wordFree(rec, pool){
  const src = pool[0], c = choOf(src[0]), goal = 3;
  const words = [];
  rec.needsReview = true;
  const add = () => {
    const inp = $("#own"); if(!inp) return;
    const w = inp.value.trim();
    if(!w) return;
    if(!isHangul(w) || w.length < 2 || w.length > 6) return setNote("한글 낱말 하나를 두 글자 이상으로 적어 주세요.");
    if(choOf(w[0]) !== c){ rec.errors++; return setNote(`‘${w}’은(는) ‘${choOf(w[0])}’(으)로 시작해요. ‘${c}’(으)로 시작하는 낱말을 적어 볼까요?`); }
    if(words.includes(w)) return setNote("이미 적은 낱말이에요.");
    words.push(w); draw(); setNote(words.length >= goal ? "목표를 채웠어요. 더 적어도 좋아요." : "좋아요.", true);
  };
  const draw = () => {
    acts = Object.assign(baseActs(rec, () => setNote(`예를 들면 ${pick(WORDS.filter(w => choOf(w[0]) === c && !words.includes(w)), 2).join(", ") || "주변을 둘러보세요"} 같은 낱말이 있어요.`)), {
      add, done(){
        rec.total = goal; rec.correct = Math.min(words.length, goal);
        rec.made = { title:rec.title, lines:[`‘${c}’(으)로 시작하는 낱말: ${words.join(", ") || "(없음)"}`, "※ 사전 확인 없이 첫소리만 확인했어요. 치료사가 함께 확인해 주세요."] };
        finishActivity(rec);
      }
    });
    render(actShell(rec, `‘${src}’의 첫소리 ‘${c}’(으)로 시작하는 낱말을 ${goal}개 이상 적어 보세요.`, `
      <div class="q" style="font-size:48px;color:var(--accent)">${c}</div>
      <div class="row" style="margin-top:0">
        <input type="text" id="own" maxlength="6" autocomplete="off" placeholder="낱말 적기">
        <button class="btn soft" data-act="add">넣기</button>
      </div>
      <div class="chips" style="margin-top:16px">${words.map(w => `<span class="chip sel">${esc(w)}</span>`).join("")}</div>
      <div class="row end"><button class="btn main" data-act="done" ${words.length?"":"disabled"}>다 적었어요 (${words.length}/${goal})</button></div>`), 3);
    const inp = $("#own");
    inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); add(); } });
    inp.focus({ preventScroll:true });
  };
  draw();
}

/* ---------- 계획 짜기 ---------- */
function planSpec(rec){
  const L = rec.level;
  if(rec.theme === "kitchen"){
    const d = dishName(), shop = story("shop") && story("shop") !== "가족이 대신" ? story("shop") : "가게";
    if(L === 1) return { slots:["오후 3시","오후 4시","오후 5시","오후 6시"], fixed:[], rules:[],
      cards:[ { id:"buy", label:"장보기", before:["prep"] }, { id:"prep", label:"재료 손질", before:["cook"] },
              { id:"cook", label:`${d} 만들기`, before:["eat"] }, { id:"eat", label:"함께 먹기" } ] };
    const base = [
      { id:"look", label:"냉장고에 뭐가 있는지 보기", before:["buy"] },
      { id:"buy", label:`${shop}에서 장보기`, before:["prep"] },
      { id:"prep", label:"재료 손질", before:["cook"] },
      { id:"cook", label:`${d} 만들기`, before:["eat"] },
      { id:"eat", label:"함께 먹기", before:["wash"] },
      { id:"wash", label:"설거지" }
    ];
    if(L === 2) return { slots:["오후 2시","오후 3시","오후 4시","오후 5시","오후 6시","오후 7시"], fixed:[], rules:[], cards:base };
    base[1].allow = [0,1];
    return { slots:["오후 1시","오후 2시","오후 3시","오후 4시","오후 5시","오후 6시","오후 7시"],
      fixed:[{ slot:2, label:"이웃과 약속" }],
      rules:["오후 3시에는 이웃과 약속이 있어요.", `${josa(shop,"은는")} 오후 3시 전에 다녀와야 해요.`],
      cards:base };
  }
  const place = placeName();
  if(L === 1) return { slots:["아침","낮","저녁"], fixed:[], rules:[], multi:true,
    cards:[ { id:"b", label:"아침 먹기", allow:[0] }, { id:"l", label:"점심 먹기", allow:[1] },
            { id:"d", label:"저녁 먹기", allow:[2] }, { id:"p", label:`${place} 가기`, allow:[0,1] } ] };
  if(L === 2) return { slots:["오전 8시","오전 10시","낮 12시","오후 3시","오후 6시","오후 9시"], fixed:[], rules:[],
    cards:[ { id:"b", label:"아침 먹기", allow:[0] }, { id:"m", label:"아침 약 먹기", with:"b", stack:true },
            { id:"p", label:`${place} 가기`, allow:[1,3] }, { id:"l", label:"점심 먹기", allow:[2] },
            { id:"w", label:"산책하기", allow:[1,3] }, { id:"d", label:"저녁 먹기", allow:[4] },
            { id:"s", label:"잠자리에 들기", allow:[5] } ] };
  return { slots:["오전 8시","오전 10시","낮 12시","오후 2시","오후 4시","오후 6시","오후 9시"],
    fixed:[{ slot:3, label:"가족과 영상통화" }],
    rules:["오후 2시에는 가족과 영상통화가 있어요.", `${josa(place,"은는")} 오전에만 갈 수 있어요.`, "산책은 점심을 먹고 나서 해요."],
    cards:[ { id:"b", label:"아침 먹기", allow:[0] }, { id:"m", label:"아침 약 먹기", with:"b", stack:true },
            { id:"p", label:`${place} 가기`, allow:[1] }, { id:"l", label:"점심 먹기", allow:[2] },
            { id:"w", label:"산책하기", after:["l"] }, { id:"d", label:"저녁 먹기", allow:[5] },
            { id:"s", label:"잠자리에 들기", allow:[6] } ] };
}
/* 각 카드가 어긴 규칙을 문장으로 돌려준다 */
function planProblems(spec, at){
  const byId = Object.fromEntries(spec.cards.map(c => [c.id, c]));
  const out = {};
  const say = (id, msg) => { (out[id] = out[id] || []).push(msg); };
  for(const c of spec.cards){
    const s = at[c.id];
    if(c.allow && !c.allow.includes(s)) say(c.id, `‘${c.label}’은(는) ${c.allow.map(k => spec.slots[k]).join(" 또는 ")}에 해요.`);
    for(const b of c.before || []) if(!(s < at[b])) say(c.id, `‘${c.label}’은(는) ‘${byId[b].label}’보다 먼저 해요.`);
    for(const a of c.after || []) if(!(s > at[a])) say(c.id, `‘${c.label}’은(는) ‘${byId[a].label}’ 다음에 해요.`);
    if(c.with && s !== at[c.with]) say(c.id, `‘${c.label}’은(는) ‘${byId[c.with].label}’ 칸에 함께 넣어요.`);
    if(spec.fixed.some(f => f.slot === s)) say(c.id, `${spec.slots[s]}에는 이미 약속이 있어요.`);
  }
  if(!spec.multi){
    spec.slots.forEach((_,k) => {
      const here = spec.cards.filter(c => at[c.id] === k && !c.stack);
      if(here.length > 1) here.slice(1).forEach(c => say(c.id, `${spec.slots[k]}에는 한 가지만 할 수 있어요.`));
    });
  }
  return out;
}
/* 규칙을 모두 지키는 배치 하나를 찾는다 — 힌트가 이 배치를 보여 준다 */
function planSolve(spec){
  const free = spec.slots.map((_,k) => k).filter(k => !spec.fixed.some(f => f.slot === k));
  const order = [...spec.cards.filter(c => !c.stack), ...spec.cards.filter(c => c.stack)];
  const at = {};
  const dfs = i => {
    if(i === order.length) return !Object.keys(planProblems(spec, at)).length;
    const c = order[i];
    const opts = c.with ? [at[c.with]] : free.filter(k => !c.allow || c.allow.includes(k));
    for(const k of opts){
      if(!spec.multi && !c.stack && order.some(o => o !== c && !o.stack && at[o.id] === k)) continue;
      at[c.id] = k;
      if(dfs(i+1)) return true;
      delete at[c.id];
    }
    return false;
  };
  return dfs(0) ? { ...at } : {};
}
RUN.plan = rec => {
  const spec = planSpec(rec);
  const sol = planSolve(spec);
  let fails = 0;
  const at = {};              // 카드 id → 칸 index
  const ok = {};              // 확인을 통과해 고정된 카드
  let sel = null, firstCheck = true;
  const tray = () => spec.cards.filter(c => at[c.id] == null);
  const draw = () => {
    acts = Object.assign(baseActs(rec, () => {
      // 힌트: 카드 하나를 규칙에 맞는 칸에 직접 놓아 준다 (막힌 배치에서 빠져나오는 길)
      const c = (sel && spec.cards.find(x => x.id === sel)) || tray()[0] ||
        spec.cards.find(x => at[x.id] !== sol[x.id]);
      if(!c || sol[c.id] == null) return;
      const k = sol[c.id];
      if(!spec.multi && !c.stack) spec.cards.forEach(o => { if(o !== c && !o.stack && at[o.id] === k){ delete at[o.id]; delete ok[o.id]; } });
      at[c.id] = k; sel = null; draw();
      setNote(`‘${c.label}’은(는) ${spec.slots[k]} 칸에 놓았어요.`);
    }), {
      card(v){ sel = v; draw(); },
      slot(v){
        const k = +v;
        if(spec.fixed.some(f => f.slot === k)) return setNote(`${spec.slots[k]}에는 이미 약속이 있어요.`);
        if(sel == null) return setNote("먼저 아래에서 카드를 하나 누르세요.");
        at[sel] = k; sel = null; draw();
      },
      back(v){ delete at[v]; delete ok[v]; draw(); },
      check(){
        const probs = planProblems(spec, at);
        spec.cards.forEach(c => { if(probs[c.id]) delete ok[c.id]; else ok[c.id] = true; });
        if(firstCheck){ rec.total = spec.cards.length; rec.correct = spec.cards.filter(c => !probs[c.id]).length; firstCheck = false; }
        const bad = Object.keys(probs);
        if(!bad.length){
          rec.made = { title:rec.title, lines:spec.slots.map((s,k) => {
            const f = spec.fixed.find(x => x.slot === k);
            const here = spec.cards.filter(c => at[c.id] === k).map(c => c.label);
            return `${s} · ${f ? f.label + " (약속)" : here.join(", ") || "쉬는 시간"}`;
          }) };
          draw(); setTimeout(() => finishActivity(rec), 600); return;
        }
        rec.errors += bad.length; fails++;
        bad.forEach(id => delete at[id]);
        draw();
        setNote((fails >= 2 ? "막히면 칸에 놓인 카드를 눌러 빼거나 ‘힌트’를 눌러 보세요. " : "") +
          "맞게 놓인 카드는 초록색으로 표시했어요. 아래로 돌아온 카드를 다시 놓아 볼까요? " + bad.map(id => probs[id][0]).join(" "));
      }
    });
    const left = tray();
    render(actShell(rec, "카드를 하나 누른 다음 시간 칸을 누르세요. 칸에 놓은 카드를 누르면 다시 빠집니다.", `
      ${spec.rules.length ? `<div class="made talk"><h3>📌 알아둘 것</h3><ul>${spec.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>` : ""}
      <div class="tray">${left.map(c => `<button class="chip ${sel===c.id?"sel":""}" data-act="card" data-v="${c.id}">${esc(c.label)}</button>`).join("") || `<span class="sub">카드를 모두 놓았어요.</span>`}</div>
      <div class="slots">
        ${spec.slots.map((s,k) => {
          const f = spec.fixed.find(x => x.slot === k);
          const here = spec.cards.filter(c => at[c.id] === k);
          return `<div class="slot ${f?"locked":""} ${here.length?"filled":""} ${sel&&!f?"ready":""}" data-act="slot" data-v="${k}" role="button" tabindex="0" aria-label="${esc(s)} 칸">
            <span class="n" style="width:auto;padding:0 12px;border-radius:12px">${esc(s)}</span>
            <span class="slotin">${f ? `🔒 ${esc(f.label)}` : here.map(c => `<button class="chip ${ok[c.id]?"sel":""}" data-act="back" data-v="${c.id}">${esc(c.label)}</button>`).join("")}</span>
          </div>`; }).join("")}
      </div>
      <div class="row end"><button class="btn main" data-act="check" ${left.length?"disabled":""}>다 짰어요</button></div>`), 3);
  };
  draw();
};

/* ==========================================================
   5. 나누기 → 생활 연결
   ========================================================== */
function screenShare(){
  const talk = pick(THEMES[S.theme].talk, 2);
  const used = talk.map(() => false);
  acts = {
    talk(v,b){
      if(used[+v]) return;
      used[+v] = true; S.talkUsed++;
      b.textContent = "✓ 이야기 나눴어요"; b.disabled = true;
    },
    next(){ screenCommit(); }
  };
  render(`
    <div class="q">오늘 함께 만든 것</div>
    ${S.activities.map(madeHTML).join("") || `<p class="sub">아직 만든 것이 없어요.</p>`}
    <h2 style="margin-top:28px">이야기 나눠요</h2>
    <p class="sub">치료사·보호자·옆 사람과 함께 이야기해 보세요.</p>
    ${talk.map((t,i) => `<div class="made talk"><h3>💬 ${esc(t)}</h3>
      <button class="btn" data-act="talk" data-v="${i}">이야기 나눴어요</button></div>`).join("")}
    <div class="row end"><button class="btn main" data-act="next" data-focus>오늘의 약속 고르기</button></div>
  `, 4);
}
function commitCards(){
  if(S.theme === "kitchen"){
    const d = dishName(), w = story("withwho"), sh = story("shop");
    return [
      `오늘 저녁, ${d} 재료가 집에 있는지 확인하기`,
      sh && sh !== "가족이 대신" ? `${sh}에서 살 것 3가지를 말해 보기` : "장 볼 것 3가지를 말해 보기",
      w && w !== "혼자" ? `${w}에게 ${d} 이야기 들려주기` : `${d} 만드는 순서를 소리 내어 말해 보기`
    ];
  }
  const kit = { "비":"우산", "눈":"장갑", "바람":"목도리", "맑음":"챙 모자", "흐림":"우산" }[S.weather] || "외출 준비물";
  return [
    `오늘 날씨에 맞게 ${kit} 챙기기`,
    `${placeName()}에 가기 전, 순서대로 준비해 보기`,
    "잠들기 전 오늘 한 일 하나 떠올리기"
  ];
}
function screenCommit(){
  const cards = commitCards();
  acts = {
    pick(v){
      S.commitment = cards[+v]; choose("실천 카드");
      render(`
        <div class="q">오늘의 약속</div>
        <div class="made talk"><h3 style="font-size:32px">✅ ${esc(S.commitment)}</h3>
          <p class="sub" style="margin:8px 0 0">다음에 만나면 해 보셨는지 같이 이야기해요.</p></div>
        <p class="sub">수고하셨어요. 화면을 치료사에게 건네 주세요.</p>
        <div class="row end"><button class="btn main" data-act="end">치료사 요약 보기</button></div>
      `, 4);
      acts = { end(){ screenSummary(); } };
    }
  };
  render(`
    <div class="q">오늘 해 볼 일 하나를 골라 주세요.</div>
    <div class="grid big">${cards.map((c,i) => `<button class="card" data-act="pick" data-v="${i}" ${i===0?"data-focus":""}><span class="ic">📌</span><b style="font-size:24px">${esc(c)}</b></button>`).join("")}</div>
  `, 4);
}

/* ==========================================================
   요약 (치료사) — 내 이야기의 내용은 기록 텍스트에 넣지 않는다
   ========================================================== */
function summaryRows(){
  const mins = Math.round(((S.finishedAt || Date.now()) - S.startedAt)/60000);
  const self = S.choices.filter(c => c.self).length;
  const moodTxt = { 5:"아주 좋음", 4:"좋음", 3:"보통", 2:"조금 안 좋음", 1:"힘듦" }[S.mood] || "미응답";
  const rows = [
    ["대상자 코드", S.clientCode || "(미입력)"],
    ["날짜 · 소요", `${new Date(S.startedAt).toLocaleDateString("ko-KR")} · 약 ${mins}분`],
    ["기분 · 날씨", `${moodTxt} · ${S.weather || "미응답"}`],
    ["체크인 지남력", `첫 시도 정답 ${S.checkin.firstTry}/${S.checkin.total} · 힌트 ${S.checkin.hints}`],
    ["주제", S.theme ? `${THEMES[S.theme].name} (${THEMES[S.theme].icf})` : "-"],
    ["내 이야기", `${S.storyAnswered}/${S.storyAsked} 질문에 답함 (내용은 저장하지 않음)`],
    ["스스로 고른 횟수", `${self}/${S.choices.length} (주제·활동·실천 카드)`],
    ["난이도 조절 요청", `대상자 ${S.levelRequests.client} · 치료사 ${S.levelRequests.therapist}`],
    ["대화 카드", `${S.talkUsed}개 사용`],
    ["실천 카드", S.commitment || "선택 안 함"]
  ];
  S.activities.forEach((a,i) => {
    const path = a.levelPath.map(l => `${l.level}${l.by==="therapist"?"(치)":l.by==="client"?"(대)":""}`).join("→");
    const score = a.stopped ? "중간에 멈춤" : a.pattern === "memo" ? "채점 없음 (대화 재료)" :
      `첫 시도 정답 ${a.correct}/${a.total}${a.needsReview ? " (치료사 확인 필요)" : ""}`;
    rows.push([`활동 ${i+1}`, `${PATTERNS[a.pattern].name} · ${PATTERNS[a.pattern].icf} · 단계 ${path} · ${score} · 오류 ${a.errors} · 힌트 ${a.hints} · ${a.durationSec}초`]);
  });
  return rows;
}
function screenSummary(){
  S.finishedAt = S.finishedAt || Date.now();
  const rows = summaryRows();
  acts = {
    copy(){
      const text = "[일상 인지활동 세션 기록]\n" + rows.map(([k,v]) => `${k}: ${v}`).join("\n");
      const done = () => setNote("기록을 복사했어요. 차트나 일지에 붙여 넣으세요.", true);
      if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
      }else fallbackCopy(text, done);
    },
    reset(){ S = freshState(); screenStart(); }
  };
  render(`
    <h1>세션 요약</h1>
    <p class="sub">수행 기록과 참여 기록입니다. 점수가 아니라 치료 과정을 남기는 용도이며 평가·진단에 쓰지 않습니다.</p>
    <table class="sum">${rows.map(([k,v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</table>
    <h2 style="margin-top:28px">오늘 만든 것</h2>
    ${S.activities.map(madeHTML).join("") || `<p class="sub">없음</p>`}
    <div id="note" class="note"></div>
    <div class="row end">
      <button class="btn" data-act="copy">기록 복사</button>
      <button class="btn main" data-act="reset">세션 끝내기 (이야기 지우기)</button>
    </div>
  `, 5);
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(_){ setNote("복사하지 못했어요. 표를 직접 옮겨 적어 주세요."); }
  ta.remove();
}

/* ==========================================================
   치료사 패널 — 1초 길게 눌러 열기
   ========================================================== */
(() => {
  const btn = $("#proBtn");
  let timer = null;
  const start = e => {
    e.preventDefault();
    btn.classList.add("holding");
    timer = setTimeout(() => { btn.classList.remove("holding"); openPro(); }, 900);
  };
  const stop = () => { clearTimeout(timer); btn.classList.remove("holding"); };
  btn.addEventListener("pointerdown", start);
  ["pointerup","pointerleave","pointercancel"].forEach(t => btn.addEventListener(t, stop));
  btn.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openPro(); } });
  btn.addEventListener("contextmenu", e => e.preventDefault());
})();
function openPro(){
  const inAct = !!S.cur;
  const inSession = S.step >= 0 && !S.finishedAt;
  $("#proPanel").innerHTML = `
    <h2>치료사 패널</h2>
    ${inAct ? `<div class="grp"><b>난이도 직접 정하기</b><div>
      ${[1,2,3].map(l => `<button class="btn ${S.cur.level===l?"main":""}" data-p="level" data-v="${l}">${LEVEL_NAMES[l]}</button>`).join("")}
      </div></div>
      <div class="grp"><div>
        <button class="btn soft" data-p="hint">힌트 보여주기</button>
        <button class="btn" data-p="skip">이 활동 그만하기</button>
      </div></div>` : `<p class="muted">활동 중에는 난이도·힌트를 여기서 조절할 수 있습니다.</p>`}
    ${S.choices.length ? `<div class="grp"><b>방금 선택(${esc(S.choices[S.choices.length-1].what)})</b><div>
      <button class="btn" data-p="assist">치료사가 도와서 고름으로 표시</button></div></div>` : ""}
    ${inSession ? `<div class="grp"><div>
      ${S.theme ? `<button class="btn" data-p="share">나누기로 이동</button>` : ""}
      <button class="btn" data-p="summary">세션 끝내고 요약 보기</button>
    </div></div>` : ""}
    <div class="grp"><div>
      <button class="btn" data-p="restart">처음 화면으로 (이야기 지우기)</button>
      <span class="spacer"></span>
      <button class="btn main" data-p="close">닫기</button>
    </div></div>`;
  $("#pro").classList.remove("hidden");
  $("#proPanel").querySelector('[data-p="close"]').focus();
}
$("#pro").addEventListener("click", e => {
  if(e.target.id === "pro") return closePro();
  const b = e.target.closest("[data-p]"); if(!b) return;
  const v = b.dataset.v;
  ({
    level(){ S.levelRequests.therapist++; closePro(); startActivity(S.cur.pattern, +v, "therapist"); },
    hint(){ closePro(); if(acts.hint) acts.hint(); },
    skip(){ closePro(); stopCurrent(); screenPick(); },
    assist(){ S.choices[S.choices.length-1].self = false; b.textContent = "✓ 표시했어요"; b.disabled = true; },
    share(){ closePro(); stopCurrent(); screenShare(); },
    summary(){ closePro(); stopCurrent(); screenSummary(); },
    restart(){ closePro(); S = freshState(); screenStart(); },
    close(){ closePro(); }
  })[b.dataset.p]();
});
function closePro(){ $("#pro").classList.add("hidden"); }
addEventListener("keydown", e => { if(e.key === "Escape") closePro(); });

screenStart();
</script>
</body>
